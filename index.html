<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="공부방장부">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0e141b">
<title>공부방 장부</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png" sizes="180x180">
<link rel="icon" href="icon-512.png" sizes="512x512">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css?v=20261021c">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>엄궁 코오롱 공부방</h1>
    </div>
    <div class="top-actions">
      <button type="button" class="icon-btn" id="syncBtn">새로고침</button>
      <span class="sync" id="syncStatus" role="status"></span>
    </div>
  </header>
  <div id="staleBanner" class="stale-banner" hidden role="status" aria-live="polite"></div>
  <input type="file" id="bankUploadInput" multiple accept=".csv,text/csv,.xlsx,.xls,.json,application/json,.jpg,.jpeg,.png,.webp,.pdf,image/*,application/pdf,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  <div id="feeIssues"></div>
  <div id="boot" class="boot" hidden></div>
  <div class="totals-head" id="totalsHead"></div>
  <div class="totals" id="totals"></div>
  <p class="totals-note" id="totalsNote"></p>
  <div class="workspace">
  <nav class="tabs" role="tablist" aria-label="화면">
    <button type="button" class="tab on" role="tab" id="tab-sales" aria-controls="panel-sales" aria-selected="true" data-tab="sales">목표</button>
    <button type="button" class="tab" role="tab" id="tab-leave" aria-controls="panel-leave" aria-selected="false" tabindex="-1" data-tab="leave">연차</button>
    <button type="button" class="tab" role="tab" id="tab-students" aria-controls="panel-students" aria-selected="false" tabindex="-1" data-tab="students">학생</button>
    <button type="button" class="tab" role="tab" id="tab-fee" aria-controls="panel-fee" aria-selected="false" tabindex="-1" data-tab="fee">교습비</button>
    <button type="button" class="tab" role="tab" id="tab-months" aria-controls="panel-months" aria-selected="false" tabindex="-1" data-tab="months">수입지출</button>
    <button type="button" class="tab" role="tab" id="tab-suji" aria-controls="panel-suji" aria-selected="false" tabindex="-1" data-tab="suji">현금흐름</button>
    <button type="button" class="tab" role="tab" id="tab-bank" aria-controls="panel-bank" aria-selected="false" tabindex="-1" data-tab="bank">거래내역</button>
  </nav>
  <div class="stage">
  <div class="panel on" id="panel-sales" role="tabpanel" aria-labelledby="tab-sales"></div>
  <div class="panel" id="panel-leave" role="tabpanel" aria-labelledby="tab-leave" aria-hidden="true"></div>
  <div class="panel" id="panel-months" role="tabpanel" aria-labelledby="tab-months" aria-hidden="true"></div>
  <div class="panel" id="panel-suji" role="tabpanel" aria-labelledby="tab-suji" aria-hidden="true"></div>
  <div class="panel" id="panel-fee" role="tabpanel" aria-labelledby="tab-fee" aria-hidden="true"></div>
  <div class="panel" id="panel-students" role="tabpanel" aria-labelledby="tab-students" aria-hidden="true"></div>
  <div class="panel" id="panel-bank" role="tabpanel" aria-labelledby="tab-bank" aria-hidden="true"></div>
  </div>
  </div>
</div>
<div class="foot" id="foot"></div>
<script src="ledger.js?v=20261021c"></script>
<script src="demo.js?v=20261021c"></script>
<script src="charts.js?v=20261021c"></script>
<script src="app.js?v=20261021c"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="공부방장부">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0e141b">
<title>공부방 장부</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png" sizes="180x180">
<link rel="icon" href="icon-512.png" sizes="512x512">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>엄궁 코오롱 공부방</h1>
    </div>
    <div class="top-actions">
      <button type="button" class="icon-btn" id="syncBtn">새로고침</button>
      <span class="sync" id="syncStatus"></span>
    </div>
  </header>
  <input type="file" id="bankUploadInput" multiple accept=".csv,text/csv,.xlsx,.xls,.json,application/json,.jpg,.jpeg,.png,.webp,.pdf,image/*,application/pdf,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  <div id="feeIssues"></div>
  <div id="boot" class="boot" hidden></div>
  <div class="totals-head" id="totalsHead"></div>
  <div class="totals" id="totals"></div>
  <p class="totals-note" id="totalsNote"></p>
  <nav class="tabs" aria-label="화면">
    <button type="button" class="tab on" data-tab="sales">목표</button>
    <button type="button" class="tab" data-tab="students">학생</button>
    <button type="button" class="tab" data-tab="fee">교습비</button>
    <button type="button" class="tab" data-tab="months">수입지출</button>
    <button type="button" class="tab" data-tab="suji">현금흐름</button>
    <button type="button" class="tab" data-tab="bank">거래내역</button>
  </nav>
  <div class="panel on" id="panel-sales"></div>
  <div class="panel" id="panel-months"></div>
  <div class="panel" id="panel-suji"></div>
  <div class="panel" id="panel-fee"></div>
  <div class="panel" id="panel-students"></div>
  <div class="panel" id="panel-bank"></div>
</div>
<div class="foot" id="foot"></div>
<script src="ledger.js"></script>
<script src="demo.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>

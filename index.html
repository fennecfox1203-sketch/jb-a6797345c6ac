<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="공부방장부"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="robots" content="noindex,nofollow"/>
<link rel="apple-touch-icon" href="icon-180.png"/>
<link rel="icon" href="icon-180.png"/>
<meta name="theme-color" content="#0b0f14"/>
<title>공부방 장부</title>
<style>
:root{
  --bg:#0b0f14; --card:#151b24; --card2:#1c2430; --line:#2a3444;
  --text:#e8eef7; --muted:#8b97a8; --inc:#3dd68c; --exp:#ff6b7a; --fee:#6aa8ff;
  --accent:#7c9cff; --tap:#222b3a; --warn:#ffb020;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.45}
body{min-height:100dvh;padding-bottom:88px}
.wrap{max-width:520px;margin:0 auto;padding:16px 14px 24px;padding-bottom:96px}
header{padding:8px 2px 14px}
header.top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
header h1{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:-.02em}
header p{margin:6px 0 0;color:var(--muted);font-size:.86rem}
.upload-btn{flex:0 0 auto;border:0;border-radius:12px;padding:10px 12px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 4px 14px rgba(37,99,235,.35)}
.upload-btn:active{transform:scale(.98);opacity:.92}
.bank-upload-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.bank-upload-row .bank-upload-copy{flex:1;min-width:0}
.bank-upload-row .bank-upload-copy .t{font-weight:700;font-size:.92rem}
.bank-upload-row .bank-upload-copy .s{margin-top:4px;color:var(--muted);font-size:.78rem;line-height:1.35}
.panel .upload-status{margin:0 0 12px}
.upload-status{margin:0 0 12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:.84rem;color:var(--muted);line-height:1.4}
.upload-status.ok{border-color:rgba(61,214,140,.35);color:var(--inc)}
.upload-status.err{border-color:rgba(255,107,122,.4);color:var(--exp)}
.upload-status b{color:var(--text);font-weight:700}
.totals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0 18px}
.tot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.tot .ym{font-size:.72rem;color:var(--muted);margin-bottom:2px}
.tot .l{font-size:.72rem;color:var(--muted);margin-bottom:4px}
.tot .v{font-size:1rem;font-weight:700;font-variant-numeric:tabular-nums}
.tot.inc .v{color:var(--inc)} .tot.exp .v{color:var(--exp)} .tot.fee .v{color:var(--fee)}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;position:sticky;top:8px;z-index:20;backdrop-filter:blur(8px);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;border:0;background:transparent;color:var(--muted);padding:10px 10px;border-radius:10px;font-size:.86rem;font-weight:600;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--tap);color:var(--text)}
.tx-path{font-size:.72rem;color:var(--muted);margin-top:2px}
.tx-path b{color:var(--text);font-weight:600}
.cat-sum{font-size:.78rem;color:var(--muted);margin-top:2px}
.bank-hint{margin:0 0 10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:.82rem;color:var(--muted);line-height:1.4}
.panel{display:none;margin-top:14px}
.panel.on{display:block}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.row:active{opacity:.85}
.row .left{min-width:0}
.row .ym{font-weight:700;font-size:1.02rem}
.row .sub{color:var(--muted);font-size:.78rem;margin-top:3px}
.row .right{text-align:right;font-variant-numeric:tabular-nums;font-size:.88rem;flex-shrink:0}
.row .right div{margin:1px 0}
.bar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:#0e131a;margin-top:8px}
.bar i{display:block;height:100%}
.bar .i{background:var(--inc)} .bar .e{background:var(--exp)} .bar .f{background:var(--fee)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;font-size:.92rem;margin:0 0 12px;cursor:pointer;border:0;background:0;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card h2{margin:0 0 10px;font-size:1.05rem}
.metric{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.metric:last-child{border-bottom:0}
.metric .n{color:var(--muted)}
.metric .a.inc{color:var(--inc)} .metric .a.exp{color:var(--exp)} .metric .a.fee{color:var(--fee)} .metric .a.warn{color:var(--warn)}
.tree-item{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.tree-item:last-child{border-bottom:0}
.tree-item .head{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.tree-item .amt{font-variant-numeric:tabular-nums;color:var(--muted)}
.tree-kids{display:none;padding-left:10px;border-left:2px solid var(--line);margin:6px 0 2px 6px}
.tree-kids.open{display:block}
.tree-kids .tree-item{background:var(--card2);border-radius:10px;margin:4px 0;border:1px solid transparent}
.line{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.line:last-child{border-bottom:0}
.line .m{color:var(--muted);font-size:.78rem}
.line .a{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.seg button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 12px;font-size:.82rem;font-weight:600;cursor:pointer}
.seg button.on{background:var(--accent);color:#0b0f14;border-color:var(--accent)}
.seg button.on.warn{background:var(--warn);color:#0b0f14;border-color:var(--warn)}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);font-size:1rem;margin-bottom:10px;outline:none}
.search:focus{border-color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.foot{position:static;margin-top:18px;background:transparent;border-top:1px solid var(--line);padding:14px 4px 8px;font-size:.75rem;color:var(--muted);text-align:center}
.filt{display:flex;gap:6px;margin-bottom:10px}
.filt button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;padding:9px;font-size:.82rem;font-weight:600;cursor:pointer}
.filt button.on{background:var(--tap);color:var(--text);border-color:#3a4660}
.filt button.on.warn{color:var(--warn);border-color:#5a4a20}
.filt button.on.ok{color:var(--inc);border-color:#1e4a35}

.xbtn{border:1px solid var(--line);background:var(--card2);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:.78rem;font-weight:600;cursor:pointer;flex-shrink:0}
.xbtn:active{opacity:.8}
.line{align-items:center}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;max-width:360px;width:100%}
.modal h3{margin:0 0 8px;font-size:1.05rem}
.modal p{margin:0 0 16px;color:var(--muted);font-size:.92rem;line-height:1.45}
.modal .acts{display:flex;gap:8px}
.modal .acts button{flex:1;border:0;border-radius:10px;padding:12px;font-size:.95rem;font-weight:700;cursor:pointer}
.modal .cancel{background:var(--tap);color:var(--text)}
.modal .ok{background:#5a3038;color:#ffb4bc}
.modal label{display:block;font-size:.78rem;color:var(--muted);margin:10px 0 4px}
.modal select,.modal input.cat-in{width:100%;box-sizing:border-box;background:var(--tap);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font-size:.95rem}
.tx-path{cursor:pointer}
.tx-path:hover{color:var(--accent)}
.tx-path.edited::after{content:' · 수정됨';font-weight:600;color:var(--accent)}
.line .cat-edit{border:0;background:var(--tap);color:var(--muted);border-radius:8px;padding:4px 8px;font-size:.72rem;font-weight:600;cursor:pointer;margin-top:4px}
.line .cat-edit:hover{color:var(--accent)}

.excluded-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:.82rem;color:var(--muted)}
.excluded-bar button{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:.82rem;cursor:pointer}


.goal-card{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin-bottom:12px}
.goal-card .big{font-size:1.55rem;font-weight:800;letter-spacing:-.02em}
.goal-card .sub{color:var(--muted);font-size:.82rem;margin-top:4px}
.goal-card .dday{color:var(--warn);font-size:1.7rem;font-weight:800}
.chart-wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px 8px;margin-bottom:12px}
.chart-wrap svg{width:100%;height:220px;display:block}
.chart-legend{display:flex;flex-wrap:wrap;gap:10px 14px;padding:4px 6px 8px;font-size:.78rem;color:var(--muted)}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chart-wrap.bars.ytd .chart-legend{flex-wrap:nowrap;justify-content:center;gap:14px 18px;padding:10px 4px 6px;font-size:.95rem;font-weight:600;white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart-wrap.bars.ytd .chart-legend i{width:12px;height:12px;border-radius:3px}
.prog{height:10px;background:var(--tap);border-radius:999px;overflow:hidden;margin-top:8px}
.prog > span{display:block;height:100%;background:linear-gradient(90deg,#6aa8ff,#3dd68c);border-radius:999px}
.month-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.month-row:last-child{border-bottom:0}
.month-row .gap.warn{color:var(--warn)}
.month-row .gap.ok{color:var(--inc)}


.totals-head{color:var(--muted);font-size:.82rem;font-weight:600;margin:0 0 6px;padding:0 2px}
.scope-bottom{margin:0;padding:8px 4px 0;color:var(--muted);font-size:.75rem;line-height:1.4;text-align:center}


.donut-block{margin-bottom:12px}
.donut-grid{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:center}
@media (max-width:380px){.donut-grid{grid-template-columns:1fr;justify-items:center}}
.donut-svg{width:140px;height:140px;display:block}
.donut-legend{display:flex;flex-direction:column;gap:6px;min-width:0;width:100%}
.donut-legend .item{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:start;font-size:.82rem}
.donut-legend .sw{width:10px;height:10px;border-radius:2px;margin-top:4px}
.donut-legend .name{color:var(--text);word-break:keep-all}
.donut-legend .pct{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.donut-legend .sub{grid-column:2 / -1;display:flex;flex-direction:column;gap:3px;margin:2px 0 4px;padding-left:2px}
.donut-legend .subrow{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.75rem}
.donut-empty{color:var(--muted);font-size:.85rem;padding:12px 0}
.donut-legend .item.foldable{cursor:pointer;-webkit-tap-highlight-color:transparent}
.donut-legend .item.foldable{grid-template-columns:10px 1fr auto auto}
.donut-legend .item.foldable .sub{display:none}
.donut-legend .item.foldable.open .sub{display:flex}
.donut-legend .detail-btn{border:0;background:0;color:var(--accent);font-size:.72rem;font-weight:600;padding:2px 0 0;cursor:pointer;white-space:nowrap;margin-top:2px}
.donut-legend .item.foldable.open .detail-btn{color:var(--muted)}
.detail-toggle{display:block;width:100%;margin:6px 0 4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--tap);color:var(--text);font-size:.88rem;font-weight:600;cursor:pointer;text-align:center}
.detail-toggle:active{opacity:.85}
.detail-panel[hidden]{display:none!important}


.tot{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s, transform .12s}
.tot:active{transform:scale(.98)}
.tot.inc:active,.tot.inc:hover{border-color:var(--inc)}
.tot.exp:active,.tot.exp:hover{border-color:var(--exp)}
.tot.fee:active,.tot.fee:hover{border-color:var(--fee)}
.chart-wrap{cursor:pointer;position:relative}
.chart-wrap .chart-hint{position:absolute;right:10px;top:8px;font-size:.72rem;color:var(--muted)}
.chart-wrap.bars.ytd .chart-hint{font-size:.82rem;font-weight:600}
.chart-wrap.detail{cursor:default}
.chart-wrap.home svg{height:auto;min-height:360px}
.chart-wrap.bars{cursor:default}
.chart-wrap.bars .chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;touch-action:pan-x;cursor:grab}
.chart-wrap.bars .chart-scroll:active{cursor:grabbing}
.chart-wrap.bars svg{height:260px;width:auto;max-width:none;min-width:0;display:block}
.chart-wrap.bars.ytd{cursor:pointer;min-height:360px;overflow:visible}
/* summary: last-9 fit ~640 viewBox, width 100%, no h-scroll; taller for readable labels */
.chart-wrap.bars.ytd .chart-scroll{overflow-x:hidden;overflow-y:visible;touch-action:manipulation;cursor:pointer}
.chart-wrap.bars.ytd svg{width:100%;height:auto;min-height:360px;max-width:100%;min-width:0;display:block}

.month-row.go{cursor:pointer}
.month-row.go:active{opacity:.75}


.goal-card .card.go{cursor:pointer;transition:border-color .15s, transform .12s}
.goal-card .card.go:active{transform:scale(.98)}
.goal-card .card.go.fee:hover,.goal-card .card.go.fee:active{border-color:var(--fee)}
.goal-card .card.go.dday:hover,.goal-card .card.go.dday:active{border-color:var(--warn)}
.goal-card .card .hint{font-size:.72rem;color:var(--muted);margin-top:8px}


.cal-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.cal-head .dd{color:var(--warn);font-size:1.4rem;font-weight:800}
.cal-month{margin-bottom:14px}
.cal-month h3{font-size:.95rem;margin:0 0 8px;font-weight:700}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;font-size:.7rem;color:var(--muted);text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--tap);border:1px solid transparent;font-size:.82rem;font-variant-numeric:tabular-nums;user-select:none}
.cal-cell.blank{visibility:hidden;pointer-events:none}
.cal-cell.past{color:#ff8b8b;background:#1a1214;border-color:#3a2226;font-weight:700;font-size:1rem}
.cal-cell.remain{color:transparent;background:#121820;border:1px dashed #2a3444}
.cal-cell.remain .n{color:#6b778a;font-size:.72rem}
.cal-cell.today{outline:2px solid var(--fee);outline-offset:0;color:var(--fee);background:#121a24}
.cal-cell.today.past{color:#ff8b8b}
.cal-cell.goal{background:rgba(245,166,35,.18);border-color:var(--warn);color:var(--warn);font-weight:800;box-shadow:0 0 0 1px rgba(245,166,35,.35)}
.cal-cell.goal .n{color:var(--warn);font-size:.7rem;display:block;line-height:1.1;text-align:center}
.cal-legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:.78rem;color:var(--muted);padding:4px 2px 0}
.cal-legend i{display:inline-flex;width:18px;height:18px;border-radius:6px;align-items:center;justify-content:center;margin-right:5px;vertical-align:middle;font-size:.75rem;font-style:normal}


.stu-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.stu-card:active{opacity:.85}
.stu-card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stu-card .name{font-weight:700;font-size:1.05rem}
.stu-card .badge{font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--tap);color:var(--muted);white-space:nowrap}
.stu-card .badge.on{background:rgba(61,214,140,.15);color:var(--inc)}
.stu-card .badge.off{background:rgba(255,107,107,.12);color:var(--exp)}
.stu-card .badge.wait{background:rgba(245,166,35,.12);color:var(--warn)}
.stu-card .meta{margin-top:6px;font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.stu-card .amt{margin-top:8px;font-weight:700;color:var(--fee);font-variant-numeric:tabular-nums}
.stu-search{width:100%;box-sizing:border-box;margin:0 0 10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--tap);color:var(--text);font-size:.95rem}
.stu-detail .row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.stu-detail .row:last-child{border-bottom:0}
.stu-detail .k{color:var(--muted);flex:0 0 38%}
.stu-detail .v{text-align:right;font-weight:600;word-break:break-all}
.stu-sec{margin:14px 0 8px;padding:0 2px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.stu-sec .t{font-size:.95rem;font-weight:800;letter-spacing:-.01em}
.stu-sec .n{font-size:.78rem;color:var(--muted)}
.stu-sec.el .t{color:#7dd3a0}
.stu-sec.mid .t{color:#6aa8ff}
.stu-sec.hi .t{color:#c4a0ff}
.stu-sec.other .t{color:var(--muted)}
.stu-grade-tag{font-size:.72rem;color:var(--muted);font-weight:600;margin:8px 2px 6px}

</style>
</head>
<body>
<div class="wrap">
  <header class="top-row" style="display:flex;align-items:center;justify-content:space-between;gap:8px">
    <div>
      <h1>엄궁 코오롱 공부방</h1>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
      <span id="syncStatus" style="font-size:11px;opacity:.75"></span>
    </div>
  </header>
  <input type="file" id="bankUploadInput" multiple accept=".csv,text/csv,.xlsx,.xls,.json,application/json,.jpg,.jpeg,.png,.webp,.pdf,image/*,application/pdf,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden />
  <div id="feeIssues"></div>
  <div class="totals-head" id="totalsHead"></div>
  <div class="totals" id="totals"></div>
  <div class="tabs">
    <button class="tab on" data-tab="sales">목표</button>
    <button class="tab" data-tab="students">학생</button>
    <button class="tab" data-tab="fee">교습비</button>
    <button class="tab" data-tab="months">수입지출</button>
    <button class="tab" data-tab="suji">현금흐름</button>
    <button class="tab" data-tab="bank">거래내역</button>
  </div>
  <div class="panel on" id="panel-sales"></div>
  <div class="panel" id="panel-months"></div>
  <div class="panel" id="panel-suji"></div>
  <div class="panel" id="panel-fee"></div>
  <div class="panel" id="panel-students"></div>
  <div class="panel" id="panel-bank"></div>
</div>
<div class="foot" id="foot"></div>
<script>
const DATA = (function(){ try{ const c=JSON.parse(localStorage.getItem('jangbuCache')||'null'); if(c && c.monthDetails) return c; }catch(e){} return {title:'엄궁 코오롱 공부방',scope:'',note:'',updated:'',latestFeeMonth:'',totals:{income:0,expense:0,fee:0},months:[],monthDetails:{},suji:{},tuition:{},billMonths:[],enroll:{},students:[]}; })();
const won = n => (n||0).toLocaleString('ko-KR') + '원';
const shortYm = ym => {
  const [y,m]=ym.split('-');
  return `${y.slice(2)}.${Number(m)}`;
};
const koShortYm = ym => {
  const [y,m]=ym.split('-');

async function queueCatOverrideItem(item){
  try{
    const res = await fetch(CAT_QUEUE_API, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ items: [item] })
    });
    if(!res.ok) return { ok:false, status: res.status };
    const data = await res.json().catch(()=>null);
    return { ok:true, data };
  }catch(err){
    return { ok:false, error: String(err && err.message || err) };
  }
}
async function checkPendingCatOverrides(){
  try{
    const res = await fetch(CAT_PENDING_API);
    if(!res.ok){
      setUploadStatus('분류 시트 대기 확인 실패 · HTTP '+res.status, 'err');

function setUploadStatus(msg, kind){
  window.__bankUploadStatus = msg ? { msg, kind: kind || '' } : null;
  const box = el('uploadStatus');
  if(!box) return;
  box.hidden = !msg;
  box.className = 'upload-status' + (kind ? ' '+kind : '');
  box.innerHTML = msg || '';
}
function bindBankUpload(){
  const btn = el('bankUploadBtn');
  const input = el('bankUploadInput');
  if(!btn || !input) return;
  btn.onclick = ()=> input.click();
  if(window.__bankUploadStatus){
    const st = window.__bankUploadStatus;
    const box = el('uploadStatus');
    if(box){
      box.hidden = !st.msg;
      box.className = 'upload-status' + (st.kind ? ' '+st.kind : '');
      box.innerHTML = st.msg || '';
    }
  }
  if(input.dataset.bound === '1') return;
  input.dataset.bound = '1';
  input.onchange = async ()=>{
    const files = input.files ? Array.from(input.files) : [];
    input.value = '';
    if(!files.length) return;

    const isBank = f => /\.(csv|xlsx|xls)$/i.test(f.name);
    const isJson = f => /\.json$/i.test(f.name);
    const isImg = f => /\.(jpg|jpeg|png|webp|bmp|tif|tiff|pdf)$/i.test(f.name) || (f.type||'').startsWith('image/') || f.type==='application/pdf';
    const isDongName = f => /동백|dong/i.test(f.name);

    const banks = files.filter(isBank);
    const jsons = files.filter(isJson);
    const imgs = files.filter(f => !isBank(f) && !isJson(f) && isImg(f));
    const other = files.filter(f => !isBank(f) && !isJson(f) && !isImg(f));

    if(banks.length !== 1){
      setUploadStatus('통장 파일은 CSV 또는 엑셀(.xlsx) <b>한 개</b>를 꼭 골라 주세요.'+(banks.length? ' (지금 '+banks.length+'개)' : ''), 'err');
      return;
    }
    const bank = banks[0];
    if(/\.xls$/i.test(bank.name) && !/\.xlsx$/i.test(bank.name)){
      setUploadStatus('<b>'+bank.name+'</b> · 구형 .xls는 안 됩니다. .xlsx 또는 CSV로 저장해 주세요.', 'err');
      return;
    }

    let card = null, dong = null;
    jsons.forEach(f=>{
      if(isDongName(f) && !dong) dong = f;
      else if(!card) card = f;
      else if(!dong) dong = f;
    });
    if(!dong && jsons.length >= 2){
      card = jsons[0];
      dong = jsons[1];
    }

    const names = [bank.name].concat(card? [card.name]:[]).concat(dong? [dong.name]:[]).concat(imgs.map(f=>f.name));
    setUploadStatus('<b>'+names.join(' · ')+'</b> 올리는 중…'+(imgs.length? '<br/>이미지 '+imgs.length+'장 서버 OCR 중(첫 장은 조금 걸릴 수 있어요)':'') );

    try{
      const body = new FormData();
      body.append('bank', bank, bank.name);
      if(card) body.append('card', card, card.name);
      if(dong) body.append('dong', dong, dong.name);
      imgs.forEach(f => body.append('evidence', f, f.name));
      const res = await fetch(BANK_UPLOAD_API, { method:'POST', body });
      const text = await res.text();
      let data = null;
      try{ data = JSON.parse(text); }catch(_){}
      if(!res.ok){
        const detail = (data && (data.detail || data.message)) || text.slice(0,160) || res.statusText;
        setUploadStatus('<b>'+bank.name+'</b> 업로드 실패 · '+detail, 'err');
        return;
      }
      const incN = (data && data.income_expense && data.income_expense.rows && data.income_expense.rows.length) || 0;
      const feeN = (data && data.tuition && data.tuition.rows && data.tuition.rows.length) || 0;
      const qn = (data && data.question_pending) || 0;
      const inn = (data && data.inputs) || {};
      window.__lastBankUpload = { file:bank.name, card: card&&card.name, dong: dong&&dong.name, images: imgs.map(f=>f.name), data, at: Date.now() };
      const sa = (data && data.sheet_apply) || {};
      const upN = sa.updates || 0;
      const apN = sa.appends || 0;
      const sqN = sa.skipped_questions || 0;
      const saLine = (sa.status && sa.status !== 'error')
        ? ('<br/>시트 반영 계획 준비됨 · 업데이트 '+upN+'건 · 추가 '+apN+'건'
           +(sqN? ' · 질문 스킵 '+sqN+'건' : '')
           +'. 마스터에게 «시트 반영»이라고 말해 주세요. (아직 시트에 쓰지 않았습니다.)')
        : (sa.status === 'error'
           ? ('<br/>시트 반영 계획 생성 실패 · '+(sa.error || '오류')+' · 분석 결과는 유지됩니다.')
           : '<br/>시트 반영은 마스터에게 «시트 반영»을 요청해 주세요. (아직 시트에 쓰지 않았습니다.)');
      setUploadStatus(
        '<b>'+bank.name+'</b> 분석 완료 · 수입지출 '+incN+'건 · 교습비 '+feeN+'건'
        +(qn? ' · 확인 질문 '+qn+'개' : '')
        +(inn.card_rows? ' · 카드힌트 '+inn.card_rows+'건' : '')
        +(inn.dong_rows? ' · 동백힌트 '+inn.dong_rows+'건' : '')
        +(inn.ocr_card_rows || inn.ocr_dong_rows ? ' · OCR 카드 '+(inn.ocr_card_rows||0)+'/동백 '+(inn.ocr_dong_rows||0) : (imgs.length? ' · 이미지 '+imgs.length+'장' : ''))
        +(other.length? ' · 기타 '+other.length+'개 제외' : '')
        +'.'
        +saLine,
        'ok'
      );
    }catch(err){
      const reader = new FileReader();
      reader.onload = ()=>{
        try{ sessionStorage.setItem('pendingBankUpload', JSON.stringify({name: bank.name, text: reader.result, at: Date.now()})); }catch(_){}
        setUploadStatus('<b>'+bank.name+'</b> 선택됨 · 분석 서버 연결 전이어서 파일만 받아 두었어요. 채팅에 같은 파일을 보내 주시면 이어서 시트에 반영할게요.', 'err');
      };
      reader.readAsText(bank);
    }
  };
}

function loadCatOverrides(){

function bankLinesRaw(ym){ return (DATA.monthDetails[ym]||[]); }
function bankLinesForMonth(ym){
  const map = loadCatOverrides();
  return bankLinesRaw(ym).map((l,i)=>{
    const key = ym + '#' + i;
    const o = map[key];
    const base = Object.assign({}, l, { _bankKey:key, _bankIdx:i });
    if(!o) return base;
    return Object.assign(base, {
      dir: o.dir != null ? o.dir : l.dir,
      cat2: o.cat2 != null ? o.cat2 : l.cat2,
      cat3: o.cat3 != null ? o.cat3 : l.cat3,
      _edited: true
    });
  });
}
function bankCatCatalog(){
  const byDir = {};
  const add = (d,c2,c3)=>{
    if(!d) return;
    if(!byDir[d]) byDir[d] = {};
    const k2 = c2 || '-';
    if(!byDir[d][k2]) byDir[d][k2] = new Set();
    byDir[d][k2].add(c3 || '-');
  };
  Object.keys(DATA.monthDetails||{}).forEach(ym=>{
    bankLinesForMonth(ym).forEach(l=> add(l.dir, l.cat2, l.cat3));
  });
  const out = {};
  Object.keys(byDir).forEach(d=>{
    out[d] = {};
    Object.keys(byDir[d]).sort().forEach(c2=>{
      out[d][c2] = [...byDir[d][c2]].sort();
    });
  });
  return out;
}

function exKey(ym, name){ return ym + '|' + name; }
function isExcluded(ym, name){ return !!loadExcluded()[exKey(ym,name)]; }
function excludePair(ym, name){
  const m = loadExcluded();
  m[exKey(ym,name)] = { ym, name, at: new Date().toISOString() };
  saveExcluded(m);
}
function restorePair(ym, name){
  const m = loadExcluded();
  delete m[exKey(ym,name)];
  saveExcluded(m);
}
function excludedForMonth(ym){
  return Object.values(loadExcluded()).filter(x => x.ym === ym);
}

function buildIncGradeKids(ym){
  const lines = (DATA.monthDetails[ym]||[]).filter(x=>x.dir==='수입');
  const byName = {};
  (DATA.students||[]).forEach(s=>{ byName[s.name]=s; });
  const order = ['초등','중등','고등','기타'];
  const buckets = {};
  order.forEach(g=> buckets[g] = {name:g, amt:0, kids:{}});
  lines.forEach(l=>{
    const amt = Number(l.amt)||0;
    const isFee = l.cat2==='교습비' || l.cat3==='교습비';
    let grade = '기타';
    let kidLabel;
    if(isFee){
      const st = byName[l.student];
      const g1 = st && st.grade1;
      if(g1==='초등'||g1==='중등'||g1==='고등') grade = g1;
      else grade = '기타';
      kidLabel = l.student || l.memo || '학생';
    } else {
      grade = '기타';
      kidLabel = l.cat2 || l.cat3 || l.memo || l.student || '기타 수입';
    }
    buckets[grade].amt += amt;
    buckets[grade].kids[kidLabel] = (buckets[grade].kids[kidLabel]||0) + amt;
  });
  return order.map(g=>{
    const b = buckets[g];
    return {
      name: b.name,
      amt: b.amt,
      kids: Object.entries(b.kids).map(([name,amt])=>({name, amt}))
        .sort((a,b)=>Math.abs(b.amt)-Math.abs(a.amt))
    };
  });
}

function ymListInclusive(fromYm, toYm){
  const out=[];
  let [y,m]=fromYm.split('-').map(Number);
  const [ty,tm]=toYm.split('-').map(Number);
  while(y<ty || (y===ty && m<=tm)){
    out.push(String(y)+'-'+String(m).padStart(2,'0'));
    m+=1; if(m>12){ m=1; y+=1; }
  }
  return out;
}

function buildDdayMonthHtml(ym, todayYmd, deadlineYmd){
  const [y,m]=ym.split('-').map(Number);
  const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const startDow = new Date(Date.UTC(y, m-1, 1)).getUTCDay(); // 0=일
  const cells=[];
  for(let i=0;i<startDow;i++) cells.push('<div class="cal-cell blank"></div>');
  for(let d=1;d<=daysInMonth;d++){
    const ymd = ym+'-'+String(d).padStart(2,'0');
    if(ymd > deadlineYmd){
      cells.push('<div class="cal-cell blank"></div>');
      continue;
    }
    const isPast = ymd < todayYmd;
    const isToday = ymd === todayYmd;
    const isGoal = ymd === deadlineYmd;
    let cls='cal-cell';
    let inner='';
    if(isGoal){
      cls += ' goal';
      inner = '<span class="n">'+d+'<br>목표</span>';
    } else if(isPast){
      cls += ' past'+(isToday?' today':'');
      inner = '✕';
    } else if(isToday){
      cls += ' today remain';
      inner = '<span class="n">'+d+'</span>';
    } else {
      cls += ' remain';
      inner = '<span class="n">'+d+'</span>';
    }
    cells.push('<div class="'+cls+'" title="'+ymd+'">'+inner+'</div>');
  }
  const title = y+'년 '+m+'월';
  return `<div class="cal-month">
    <h3>${title}</h3>
    <div class="cal-dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="cal-grid">${cells.join('')}</div>
  </div>`;
}

function donutSlices(kids){
  // 절대값 기준 비중. 0·음수만 있으면 빈 배열.
  const parts = (kids||[]).map(k=>({
    name: k.name || '기타',
    amt: Number(k.amt)||0,
    abs: Math.abs(Number(k.amt)||0),
    kids: k.kids||[]
  })).filter(k=>k.abs>0);
  parts.sort((a,b)=>b.abs-a.abs);
  const total = parts.reduce((s,p)=>s+p.abs,0);
  return {parts, total};
}

function donutSVG(parts, total, colors){
  const size=140, cx=70, cy=70, R=54, r=32;
  if(!total || !parts.length){
    return `<svg class="donut-svg" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#2a3444" stroke-width="18"/><text x="${cx}" y="${cy+4}" text-anchor="middle" fill="#8b97a8" font-size="11">없음</text></svg>`;
  }
  let ang = -Math.PI/2;
  const arcs=[];
  parts.forEach((p,i)=>{
    const sweep = (p.abs/total)*Math.PI*2;
    const a0=ang, a1=ang+sweep;
    ang=a1;
    const large = sweep > Math.PI ? 1 : 0;
    const x0=cx+R*Math.cos(a0), y0=cy+R*Math.sin(a0);
    const x1=cx+R*Math.cos(a1), y1=cy+R*Math.sin(a1);
    const ix0=cx+r*Math.cos(a1), iy0=cy+r*Math.sin(a1);
    const ix1=cx+r*Math.cos(a0), iy1=cy+r*Math.sin(a0);
    const d=`M ${x0} ${y0} A ${R} ${R} 0 ${large} 1 ${x1} ${y1} L ${ix0} ${iy0} A ${r} ${r} 0 ${large} 0 ${ix1} ${iy1} Z`;
    arcs.push(`<path d="${d}" fill="${colors[i%colors.length]}"/>`);
  });
  return `<svg class="donut-svg" viewBox="0 0 ${size} ${size}" role="img">${arcs.join('')}<circle cx="${cx}" cy="${cy}" r="${r-0.5}" fill="var(--card)"/></svg>`;
}

function donutLegend(parts, total, colors){
  if(!parts.length) return `<div class="donut-empty">항목 없음</div>`;
  return `<div class="donut-legend">${parts.map((p,i)=>{
    const pct = total ? (p.abs/total*100) : 0;
    const pctTxt = (pct>=10 || pct===0) ? pct.toFixed(0) : pct.toFixed(1);
    const subs = (p.kids||[]).filter(k=>Math.abs(Number(k.amt)||0)>0)
      .sort((a,b)=>Math.abs(b.amt)-Math.abs(a.amt))
      .map(k=>{
        const ka=Math.abs(Number(k.amt)||0);
        const kp=total?(ka/total*100):0;
        const kt=(kp>=10||kp===0)?kp.toFixed(0):kp.toFixed(1);
        return `<div class="subrow"><span>${k.name}</span><span>${won(k.amt)} · ${kt}%</span></div>`;
      }).join('');
    return `<div class="item">
      <span class="sw" style="background:${colors[i%colors.length]}"></span>
      <div class="name">${p.name}<div style="color:var(--muted);font-size:.75rem;margin-top:1px">${won(p.amt)}</div></div>
      <div class="pct">${pctTxt}%</div>
      ${subs?`<div class="sub">${subs}</div>`:''}
    </div>`;
  }).join('')}</div>`;
}

function donutBlock(title, kids, colorOffset){
  // 모든 도넛: 옆 상세는 접고, 항목/상세 버튼으로만 펼침
  return donutBlockFoldable(title, kids, colorOffset);
}

function donutLegendFoldable(parts, total, colors){
  if(!parts.length) return `<div class="donut-empty">항목 없음</div>`;
  return `<div class="donut-legend">${parts.map((p,i)=>{
    const pct = total ? (p.abs/total*100) : 0;
    const pctTxt = (pct>=10 || pct===0) ? pct.toFixed(0) : pct.toFixed(1);
    const kids = (p.kids||[]).filter(k=>Math.abs(Number(k.amt)||0)>0)
      .sort((a,b)=>Math.abs(b.amt)-Math.abs(a.amt));
    const subs = kids.map(k=>{
      const ka=Math.abs(Number(k.amt)||0);
      const kp=total?(ka/total*100):0;
      const kt=(kp>=10||kp===0)?kp.toFixed(0):kp.toFixed(1);
      return `<div class="subrow"><span>${k.name}</span><span>${won(k.amt)} · ${kt}%</span></div>`;
    }).join('');
    const detailCtrl = kids.length
      ? `<button type="button" class="detail-btn" aria-label="상세보기">상세</button>`
      : `<span></span>`;
    return `<div class="item foldable" data-fold="${i}">
      <span class="sw" style="background:${colors[i%colors.length]}"></span>
      <div class="name">${p.name}<div style="color:var(--muted);font-size:.75rem;margin-top:1px">${won(p.amt)}</div></div>
      <div class="pct">${pctTxt}%</div>
      ${detailCtrl}
      ${subs?`<div class="sub">${subs}</div>`:''}
    </div>`;
  }).join('')}</div>`;
}

function donutBlockFoldable(title, kids, colorOffset){
  const {parts, total} = donutSlices(kids);
  const colors = DONUT_COLORS.map((_,i)=>DONUT_COLORS[(i+(colorOffset||0))%DONUT_COLORS.length]);
  return `<div class="donut-block card">
    <h2>${title}${total?` · ${won(total)}`:''}</h2>
    <div class="donut-grid">
      ${donutSVG(parts, total, colors)}
      ${donutLegendFoldable(parts, total, colors)}
    </div>
  </div>`;
}

function bindFoldableLegend(root){
  const scope = root || document;
  scope.querySelectorAll('.donut-legend').forEach(legend=>{
    legend.querySelectorAll('.item.foldable').forEach(item=>{
      item.addEventListener('click', (e)=>{
        e.stopPropagation();
        const wasOpen = item.classList.contains('open');
        legend.querySelectorAll('.item.foldable.open').forEach(x=>x.classList.remove('open'));
        legend.querySelectorAll('.item.foldable .detail-btn').forEach(b=>{ b.textContent='상세'; });
        if(!wasOpen){
          item.classList.add('open');
          const btn = item.querySelector('.detail-btn');
          if(btn) btn.textContent='접기';
        }
      });
    });
  });
}

function bindDetailPanel(toggleId, panelId){
  const btn = el(toggleId);
  const panel = el(panelId);
  if(!btn || !panel) return;
  btn.onclick = (e)=>{
    e.stopPropagation();
    const open = panel.hasAttribute('hidden');
    if(open){ panel.removeAttribute('hidden'); btn.textContent='접기'; }
    else { panel.setAttribute('hidden',''); btn.textContent='상세보기'; }
  };
}

function buildMonthsLineChart(opts){
  // summary: 최근 9개월 · 고정 ~640 viewBox · declutter · 스크롤 없음. detail: 전체 월 + 좌우 스크롤.
  const summary = !!(opts && opts.summary);
  const showValues = opts && opts.showValues !== false;
  let yms = monthsChartMonths(null);
  if(summary) yms = filterYtdYms(yms);
  const byYm = {};
  (DATA.months||[]).forEach(m=>{ byYm[m.ym]=m; });
  const points = yms.map(ym=>{
    const m = byYm[ym] || {ym, income:0, expense:0, fee:0};
    return {
      ym,
      income: Math.abs(Number(m.income)||0),
      expense: Math.abs(Number(m.expense)||0)
    };
  });
  const n = yms.length || 1;
  const padL = summary ? 32 : 48, padR = summary ? 10 : 28, padT = summary ? 58 : 36, padB = summary ? 40 : 44;
  const H = summary ? 420 : 260;
  const visibleN = (opts && opts.visible != null) ? opts.visible : 6;
  let slot, plotW, W, scrollLeft;
  if(summary){
    W = 640;
    plotW = W - padL - padR;
    slot = plotW / n;
    scrollLeft = 0;
  } else {
    slot = 56;
    plotW = Math.max(n * slot, visibleN * slot);
    W = padL + plotW + padR;
    scrollLeft = Math.max(0, (n - visibleN) * slot);
  }
  const plotH = H - padT - padB;
  const maxV = Math.max(1, ...points.flatMap(p=>[p.income,p.expense]));
  const axisMax = Math.max(maxV * 1.14, 1000000);
  const xAt = i => padL + slot/2 + i * slot;
  const yAt = v => padT + plotH * (1 - Math.min(v, axisMax) / axisMax);
  const tickFracs = summary ? [0, 1] : [0, 0.25, 0.5, 0.75, 1];
  const tickVals = tickFracs.map(t=>Math.round(axisMax*t/10000)*10000);
  const yTicks = tickVals.map(v=>{
    const y = yAt(v);
    return `<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="#2a3444" stroke-width="1"/>
      <text x="${padL-6}" y="${y+3}" text-anchor="end" fill="#8b97a8" font-size="${summary?15:10}">${axisLabel(v)}</text>`;
  }).join('');

  const labelPos = points.map((p,i)=>{
    const yi = yAt(p.income), ye = yAt(p.expense);
    const gap = Math.abs(yi - ye);
    const close = gap < (summary ? 36 : 22);
    const incAbove = p.income >= p.expense;
    const out = {
      income: { y: yi + (incAbove ? -14 : 18), x: xAt(i) + (close ? (incAbove ? -6 : 6) : 0) },
      expense: { y: ye + (incAbove ? 18 : -14), x: xAt(i) + (close ? (incAbove ? 6 : -6) : 0) }
    };
    out.income.y = Math.min(H - 22, Math.max(padT - 4, out.income.y));
    out.expense.y = Math.min(H - 22, Math.max(padT - 4, out.expense.y));
    return out;
  });

  function haloText(x, y, fill, text){
    const fs = summary ? 17 : 10;
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" fill="${fill}" font-size="${fs}" font-weight="700" stroke="#0b0f14" stroke-width="4" paint-order="stroke" style="paint-order:stroke fill">${text}</text>`;
  }

  function polyFor(key, color){
    const pts = points.map((p,i)=>`${xAt(i).toFixed(1)},${yAt(p[key]).toFixed(1)}`).join(' ');
    const dots = points.map((p,i)=>{
      const label = String(Number(p.ym.slice(5)));
      const lp = labelPos[i][key];
      const fill = key==='income' ? 'var(--inc)' : 'var(--exp)';
      const valLab = showValues ? haloText(lp.x, lp.y, fill, String(Math.round(p[key]/10000))) : '';
      const mFs = summary ? 16 : 10;
      const mLab = (key==='expense') ? `<text x="${xAt(i).toFixed(1)}" y="${H-12}" text-anchor="middle" fill="#8b97a8" font-size="${mFs}">${label}</text>` : '';
      const r = summary ? 5.2 : 3.5;
      const dot = `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(p[key]).toFixed(1)}" r="${r}" fill="${color}" stroke="#0b0f14" stroke-width="1.2"/>`;
      return `${dot}${valLab}${mLab}`;
    }).join('');
    const sw = summary ? 3.5 : 2.4;
    return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }
  const body = polyFor('income','var(--inc)') + polyFor('expense','var(--exp)');
  const hits = points.map((p,i)=>{
    const x = padL + i * slot;
    return `<rect class="months-hit" data-ym="${p.ym}" x="${x}" y="${padT}" width="${slot}" height="${plotH}" fill="transparent" style="cursor:pointer"/>`;
  }).join('');
  const svgSize = summary
    ? `viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet"`
    : `viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" preserveAspectRatio="xMinYMid meet"`;
  return {
    yms, points, scrollLeft, slot, padL, summary,
    svg: `<svg ${svgSize} role="img" aria-label="월별 수입·지출 꺾은선">${yTicks}${body}${hits}</svg>`
  };
}

function buildSujiCashFlowChart(opts){
  // summary: 최근 9개월 · declutter · 스크롤 없음. detail: 전체 월 + 좌우 스크롤.
  const summary = !!(opts && opts.summary);
  const showValues = opts && opts.showValues !== false;
  let yms = sujiChartMonths(null);
  if(summary) yms = filterYtdYms(yms);
  const points = yms.map(ym=>{
    const {inc, exp} = monthSujiParts(ym);
    const income = Math.abs(Number(inc.amt)||0);
    const expense = Math.abs(Number(exp.amt)||0);
    const flow = income - expense;
    return { ym, income, expense, flow };
  });
  const n = Math.max(points.length, 1);
  const padL = summary ? 32 : 52, padR = summary ? 10 : 12, padT = summary ? 58 : 36, padB = summary ? 40 : 44;
  const H = summary ? 420 : 260;
  const visibleN = (opts && opts.visible != null) ? opts.visible : 6;
  let barW, gap, slotW, plotW, W, scrollLeft;
  if(summary){
    W = 640;
    plotW = W - padL - padR;
    slotW = plotW / n;
    barW = Math.max(26, Math.min(58, slotW * 0.92));
    gap = slotW - barW;
    scrollLeft = 0;
  } else {
    barW = 28;
    gap = 10;
    slotW = barW + gap;
    plotW = Math.max(n * slotW, visibleN * slotW);
    W = padL + plotW + padR;
    scrollLeft = Math.max(0, (points.length - visibleN) * slotW);
  }
  const plotH = H - padT - padB;
  const vals = points.map(p=>p.flow);
  const maxAbs = Math.max(1, ...(vals.length ? vals.map(v=>Math.abs(v)) : [1]));
  const axisMax = Math.max(maxAbs * 1.12, 1000000);
  const axisMin = -axisMax;
  const span = axisMax - axisMin;
  const xAt = i => padL + (i + 0.5) * slotW;
  const yAt = v => padT + plotH * (1 - (v - axisMin) / span);
  const y0 = yAt(0);
  let yTicks;
  if(summary){
    // labels at ±max + 0; only mid (0) grid line
    const labs = [axisMin, 0, axisMax].map(v=>{
      const nice = Math.round(v/10000)*10000;
      const y = yAt(nice);
      const isZero = Math.abs(nice) < 1;
      const grid = isZero
        ? `<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="#3a4660" stroke-width="1.5" stroke-dasharray="4 3"/>`
        : '';
      return `${grid}<text x="${padL-6}" y="${y+3}" text-anchor="end" fill="#8b97a8" font-size="15">${axisLabel(nice)}</text>`;
    }).join('');
    yTicks = labs;
  } else {
    const tickVals = [];
    const tickN = 4;
    for(let i=0;i<=tickN;i++) tickVals.push(axisMin + span * (i/tickN));
    yTicks = tickVals.map(v=>{
      const y = yAt(v);
      const nice = Math.round(v/10000)*10000;
      const isZero = Math.abs(nice) < 1;
      return `<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="${isZero?'#3a4660':'#2a3444'}" stroke-width="${isZero?1.5:1}" ${isZero?'stroke-dasharray="4 3"':''}/>
      <text x="${padL-6}" y="${y+3}" text-anchor="end" fill="#8b97a8" font-size="10">${axisLabel(nice)}</text>`;
    }).join('');
  }
  const selYm = (opts && opts.selectedYm) || (typeof state!=='undefined' && state.month) || null;
  const bars = points.map((p,i)=>{
    const v = p.flow;
    const y = yAt(v);
    const top = Math.min(y, y0);
    const h = Math.max(2, Math.abs(y0 - y));
    const fill = v > 0 ? 'var(--inc)' : (v < 0 ? 'var(--exp)' : '#8b97a8');
    const cx = xAt(i);
    const label = String(Number(p.ym.slice(5)));
    const valY = v >= 0 ? (top - 10) : (top + h + 16);
    const selected = selYm && p.ym === selYm;
    const vFs = summary ? 17 : 10;
    const mFs = summary ? 16 : 10;
    const showVal = showValues;
    const valLab = showVal
      ? `<text x="${cx.toFixed(1)}" y="${valY.toFixed(1)}" text-anchor="middle" fill="${fill}" font-size="${vFs}" font-weight="700" stroke="#0b0f14" stroke-width="4" paint-order="stroke" style="paint-order:stroke fill">${Math.round(v/10000)}</text>`
      : '';
    return `
      <rect x="${(cx-barW/2).toFixed(1)}" y="${top.toFixed(1)}" width="${barW}" height="${h.toFixed(1)}" rx="5" fill="${fill}" opacity="1" stroke="${selected?'#e8eef7':'none'}" stroke-width="${selected?1.5:0}"/>
      ${valLab}
      <text x="${cx.toFixed(1)}" y="${H-12}" text-anchor="middle" fill="${selected?'#e8eef7':'#8b97a8'}" font-size="${mFs}" font-weight="${selected?700:400}">${label}</text>`;
  }).join('');
  const hits = points.map((p,i)=>{
    const x = padL + i * slotW;
    return `<rect class="suji-hit" data-ym="${p.ym}" x="${x.toFixed(1)}" y="${padT}" width="${slotW}" height="${plotH}" fill="transparent" style="cursor:pointer"/>`;
  }).join('');
  const svgSize = summary
    ? `viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet"`
    : `viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" preserveAspectRatio="xMinYMid meet"`;
  return {
    yms, points, scrollLeft, barW, gap, padL, summary,
    svg: `<svg ${svgSize} role="img" aria-label="월별 현금흐름 막대">${yTicks}${bars}${hits}</svg>`
  };
}

function currentYmSeoul(){
  // 미납은 «해당 납부대상월»이 시작된 뒤에만 잡는다 (서울 기준).
  try {
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit'
    }).formatToParts(new Date());
    const y = parts.find(p=>p.type==='year').value;
    const m = parts.find(p=>p.type==='month').value;
    return y + '-' + m;
  } catch(e) {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }
}

function isFeeMonthOpen(ym){
  return !!ym && ym <= currentYmSeoul();
}

function unpaidVisibleFor(ym){
  if(!isFeeMonthOpen(ym)) return [];
  const block=DATA.tuition[ym]||{unpaid:[]};
  const exNames=new Set(excludedForMonth(ym).map(x=>x.name));
  return (block.unpaid||[]).filter(s=>!exNames.has(s.name));
}

function allUnpaidByMonth(){
  const out=[];
  for(const ym of (DATA.billMonths||[])){
    let list=unpaidVisibleFor(ym);
    if(state.q){
      const q=state.q.toLowerCase();
      list=list.filter(s=>(s.name+(s.grade||'')).toLowerCase().includes(q));
    }
    if(list.length) out.push({ym, list, total:list.reduce((a,s)=>a+(s.expected||0),0)});
  }
  return out;
}

const SALES_GOAL_1 = 10000000; // 1차 목표 1,000만원
const SALES_GOAL_2 = 15000000; // 최종 목표 1,500만원 (그래프만)
const SALES_DEADLINE = '2026-12-31'; // 1차 목표 기한
const SALES_AXIS_MAX = 15000000; // 왼쪽 축 고정 상한 (균등)

function seoulYmd(){
  try {
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone:'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit'
    }).formatToParts(new Date());
    const get = t => parts.find(p=>p.type===t).value;
    return get('year')+'-'+get('month')+'-'+get('day');
  } catch(e){
    const d=new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
}

function daysUntil(ymd){
  const [y,m,d]=ymd.split('-').map(Number);
  const [cy,cm,cd]=seoulYmd().split('-').map(Number);
  const target = Date.UTC(y, m-1, d);
  const today = Date.UTC(cy, cm-1, cd);
  return Math.round((target - today) / 86400000);
}

function salesMonths(limit){
  const cur = currentYmSeoul();
  const set = new Set((DATA.billMonths || []).filter(ym => ym <= cur));
  // ensure current month axis point exists even if tuition block missing
  set.add(cur);
  let all = [...set].sort();
  if(limit && all.length > limit) all = all.slice(-limit);
  return all;
}

function monthHasUnpaid(ym){
  if(!isFeeMonthOpen(ym)) return false;
  return unpaidVisibleFor(ym).length > 0;
}

function feeSales(ym){
  const t = (DATA.tuition||{})[ym];
  return t && typeof t.paidTotal==='number' ? t.paidTotal : 0;
}

function axisLabel(v){
  if(v === 0) return '0';
  if(v % 10000000 === 0) return (v/10000000) + '천만';
  if(v % 10000 === 0) return (v/10000) + '만';
  return won(v);
}

function bindChartHDrag(sc){
  if(!sc || sc.dataset.dragBound === '1') return;
  sc.dataset.dragBound = '1';
  let down = false, startX = 0, startLeft = 0, moved = false;
  sc.style.touchAction = 'pan-x';
  sc.style.cursor = 'grab';
  sc.addEventListener('pointerdown', e=>{
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    down = true; moved = false;
    startX = e.clientX; startLeft = sc.scrollLeft;
    sc.style.cursor = 'grabbing';
    try{ sc.setPointerCapture(e.pointerId); }catch(_){}
  });
  sc.addEventListener('pointermove', e=>{
    if(!down) return;
    const dx = e.clientX - startX;
    if(Math.abs(dx) > 4) moved = true;
    sc.scrollLeft = startLeft - dx;
  });
  const end = e=>{
    if(!down) return;
    down = false;
    sc.style.cursor = 'grab';
    if(moved){
      // swallow the click that would fire after a drag
      const sink = ev=>{ ev.stopPropagation(); ev.preventDefault(); sc.removeEventListener('click', sink, true); };
      sc.addEventListener('click', sink, true);
    }
  };
  sc.addEventListener('pointerup', end);
  sc.addEventListener('pointercancel', end);
}

function buildSalesChart(opts){
  const detail = !!(opts && opts.detail);
  // 홈·기본은 최근 1년(12개월). detail 옵션만 전체.
  const lastN = (opts && opts.last != null) ? opts.last : (detail ? null : 12);
  const months = salesMonths(lastN);
  const curYm = currentYmSeoul();
  const points = months.map(ym => {
    const has = !!(DATA.tuition||{})[ym];
    return { ym, v: has ? feeSales(ym) : null };
  });
  const showValOpt = detail || !!(opts && opts.showValues);
  const W = detail ? 720 : 640;
  const H = showValOpt ? 320 : 240;
  const padL = showValOpt ? 56 : 52, padR = 14, padT = showValOpt ? 32 : 22, padB = showValOpt ? 48 : 40;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  // 축: 목표 상한과 데이터 최대 중 큰 쪽. 너무 낮으면 목표선이 잘리므로 최소 1차 목표.
  const dataMax = Math.max(0, ...points.map(p => p.v || 0));
  const maxV = Math.max(SALES_GOAL_1, Math.min(SALES_AXIS_MAX, Math.ceil(Math.max(dataMax, SALES_GOAL_1) * 1.08 / 1000000) * 1000000));
  const n = months.length;
  const xAt = i => padL + (n<=1 ? plotW/2 : (i * plotW / (n-1)));
  const yAt = v => padT + plotH * (1 - Math.min(v, maxV) / maxV);
  const tickStep = maxV <= 10000000 ? 2500000 : 5000000;
  const tickVals = [];
  for(let t=0; t<=maxV+1; t+=tickStep) tickVals.push(t);
  if(tickVals[tickVals.length-1] < maxV) tickVals.push(maxV);
  const yTicks = tickVals.map(v=>{
    const y = yAt(v);
    return `<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="#2a3444" stroke-width="1"/>
      <text x="${padL-6}" y="${y+3}" text-anchor="end" fill="#8b97a8" font-size="10">${axisLabel(v)}</text>`;
  }).join('');
  const y1 = yAt(SALES_GOAL_1);
  const y2 = yAt(Math.min(SALES_GOAL_2, maxV));
  let polyParts = [];
  let seg = [];
  points.forEach((pt,i)=>{
    if(pt.v == null){
      if(seg.length){ polyParts.push(seg); seg=[]; }
      return;
    }
    seg.push(`${xAt(i).toFixed(1)},${yAt(pt.v).toFixed(1)}`);
  });
  if(seg.length) polyParts.push(seg);
  const lineW = detail ? 3.4 : 3.2;
  // 어두운 배경용 외곽선 + 밝은 본선
  const polylines = polyParts.map(s=>{
    const pts = s.join(' ');
    return `<polyline points="${pts}" fill="none" stroke="#0b0f14" stroke-width="${lineW+2.2}" stroke-linejoin="round" stroke-linecap="round"/>
      <polyline points="${pts}" fill="none" stroke="#8ec5ff" stroke-width="${lineW}" stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join('');
  const dots = points.map((pt,i)=>{
    if(pt.v == null) return '';
    const unpaid = monthHasUnpaid(pt.ym);
    const over = pt.v >= SALES_GOAL_1;
    const fill = unpaid ? 'var(--exp)' : (over ? 'var(--inc)' : (pt.ym===curYm ? '#b8daff' : '#8ec5ff'));
    const label = String(Number(pt.ym.slice(5)));
    const showLab = detail || n<=18 || i%2===0 || pt.ym===curYm;
    const showVal = detail || !!(opts && opts.showValues);
    const valLab = showVal ? `<text x="${xAt(i).toFixed(1)}" y="${(yAt(pt.v)-12).toFixed(1)}" text-anchor="middle" fill="#e8eef7" font-size="10" font-weight="700" stroke="#0b0f14" stroke-width="3" paint-order="stroke" style="paint-order:stroke fill">${Math.round(pt.v/10000)}</text>` : '';
    return `
      <circle cx="${xAt(i).toFixed(1)}" cy="${yAt(pt.v).toFixed(1)}" r="5" fill="${fill}" stroke="#0b0f14" stroke-width="2"/>
      ${valLab}
      ${showLab?`<text x="${xAt(i).toFixed(1)}" y="${H-12}" text-anchor="middle" fill="${pt.ym===curYm?'#e8eef7':'#8b97a8'}" font-size="10" font-weight="${pt.ym===curYm?700:400}">${label}</text>`:''}
    `;
  }).join('');
  const goal1 = `<line x1="${padL}" x2="${W-padR}" y1="${y1}" y2="${y1}" stroke="var(--warn)" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.75"/>
        <text x="${W-padR}" y="${y1-6}" text-anchor="end" fill="var(--warn)" font-size="10" opacity="0.9">1차 1000만</text>`;
  const goal2 = SALES_GOAL_2 <= maxV
    ? `<line x1="${padL}" x2="${W-padR}" y1="${y2}" y2="${y2}" stroke="var(--inc)" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.65"/>
        <text x="${W-padR}" y="${y2-6}" text-anchor="end" fill="var(--inc)" font-size="10" opacity="0.85">최종 1500만</text>`
    : '';
  return {
    months, points, curYm,
    svg: `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="월별 교습비 매출 꺾은선 · 최근 1년">
        ${yTicks}
        ${goal1}
        ${goal2}
        ${polylines}
        ${dots}
      </svg>`
  };
}

function buildSalesBarChart(opts){
  // summary: 최근 9개월 · declutter · 큰 글씨 · 스크롤 없음. detail: 전체 월 + 좌우 스크롤.
  const summary = !!(opts && opts.summary);
  let months = salesMonths();
  if(summary) months = filterYtdYms(months, currentYmSeoul());
  const curYm = currentYmSeoul();
  const points = months.map(ym => {
    const has = !!(DATA.tuition||{})[ym];
    return { ym, v: has ? feeSales(ym) : null };
  });
  const n = Math.max(months.length, 1);
  const padL = summary ? 32 : 48, padR = summary ? 10 : 12, padT = summary ? 58 : 28, padB = summary ? 40 : 36;
  const H = summary ? 420 : 260;
  const visibleN = (opts && opts.visible != null) ? opts.visible : 6;
  let barW, gap, slotW, plotW, W, scrollLeft;
  if(summary){
    W = 640;
    plotW = W - padL - padR;
    slotW = plotW / n;
    barW = Math.max(26, Math.min(58, slotW * 0.92));
    gap = slotW - barW;
    scrollLeft = 0;
  } else {
    barW = 28;
    gap = 10;
    slotW = barW + gap;
    plotW = Math.max(n * slotW, visibleN * slotW);
    W = padL + plotW + padR;
    scrollLeft = Math.max(0, (n - visibleN) * slotW);
  }
  const plotH = H - padT - padB;
  const maxV = SALES_AXIS_MAX;
  const xAt = i => padL + i * slotW + barW / 2;
  const yAt = v => padT + plotH * (1 - Math.min(Math.max(v,0), maxV) / maxV);
  const y0 = yAt(0);
  let yTicks;
  if(summary){
    const mid = maxV / 2;
    const midY = yAt(mid);
    yTicks = [
      `<line x1="${padL}" x2="${W-padR}" y1="${midY}" y2="${midY}" stroke="#2a3444" stroke-width="1"/>`,
      `<text x="${padL-6}" y="${yAt(0)+3}" text-anchor="end" fill="#8b97a8" font-size="15">${axisLabel(0)}</text>`,
      `<text x="${padL-6}" y="${midY+3}" text-anchor="end" fill="#8b97a8" font-size="15">${axisLabel(mid)}</text>`,
      `<text x="${padL-6}" y="${yAt(maxV)+3}" text-anchor="end" fill="#8b97a8" font-size="15">${axisLabel(maxV)}</text>`
    ].join('');
  } else {
    const tickVals = [0, 5000000, 10000000, 15000000];
    yTicks = tickVals.map(v=>{
      const y = yAt(v);
      return `<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="#2a3444" stroke-width="1"/>
      <text x="${padL-6}" y="${y+3}" text-anchor="end" fill="#8b97a8" font-size="10">${axisLabel(v)}</text>`;
    }).join('');
  }
  const y1 = yAt(SALES_GOAL_1);
  const y2 = yAt(SALES_GOAL_2);
  const bars = points.map((pt,i)=>{
    const mFs = summary ? 16 : 10;
    if(pt.v == null) {
      return `<text x="${xAt(i).toFixed(1)}" y="${H-12}" text-anchor="middle" fill="#5a6575" font-size="${mFs}">${String(Number(months[i].slice(5)))}</text>`;
    }
    const unpaid = monthHasUnpaid(pt.ym);
    const over = pt.v >= SALES_GOAL_1;
    const fill = unpaid ? 'var(--exp)' : (over ? 'var(--inc)' : (pt.ym===curYm ? 'var(--fee)' : '#6aa8ff'));
    const y = yAt(pt.v);
    const h = Math.max(2, y0 - y);
    const label = String(Number(pt.ym.slice(5)));
    const val = Math.round(pt.v/10000);
    const vFs = summary ? 17 : 10;
    const valLab = `<text x="${xAt(i).toFixed(1)}" y="${(y-10).toFixed(1)}" text-anchor="middle" fill="#e8eef7" font-size="${vFs}" font-weight="700" stroke="#0b0f14" stroke-width="4" paint-order="stroke" style="paint-order:stroke fill">${val}</text>`;
    return `
      <rect class="sales-bar" data-fee-ym="${pt.ym}" x="${(xAt(i)-barW/2).toFixed(1)}" y="${y.toFixed(1)}" width="${barW}" height="${h.toFixed(1)}" rx="5" fill="${fill}" opacity="1"/>
      ${valLab}
      <text x="${xAt(i).toFixed(1)}" y="${H-12}" text-anchor="middle" fill="${pt.ym===curYm?'#e8eef7':'#8b97a8'}" font-size="${mFs}" font-weight="${pt.ym===curYm?700:400}">${label}</text>`;
  }).join('');
  const svgSize = summary
    ? `viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet"`
    : `viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="width:${W}px;height:${H}px;min-width:${W}px" preserveAspectRatio="xMinYMid meet"`;
  const goalFs = summary ? 13 : 11;
  return {
    months, points, curYm, width: W, scrollLeft, summary,
    svg: `<svg ${svgSize} role="img" aria-label="월별 교습비 매출 막대">
        ${yTicks}
        <line x1="${padL}" x2="${W-padR}" y1="${y1}" y2="${y1}" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 4"/>
        <text x="${W-padR}" y="${y1-6}" text-anchor="end" fill="var(--warn)" font-size="${goalFs}">1차 1000만</text>
        <line x1="${padL}" x2="${W-padR}" y1="${y2}" y2="${y2}" stroke="var(--inc)" stroke-width="1.5" stroke-dasharray="2 4"/>
        <text x="${W-padR}" y="${y2-6}" text-anchor="end" fill="var(--inc)" font-size="${goalFs}">최종 1500만</text>
        ${bars}
      </svg>`
  };
}

      <div class="card" style="padding:6px 14px">
        <h2 style="margin:8px 0 4px">지출 상세</h2>
        <button type="button" class="detail-toggle" id="expDetailToggle">상세보기</button>
        <div class="detail-panel" id="expDetailPanel" hidden>

    const paid = (block.paid||[]).slice();
    const stuByName = {};
    (DATA.students||[]).forEach(s=>{ if(s && s.name) stuByName[s.name]=s; });

        name: s.name || '학생',
        amt: s.amt||0,
        grade: s.grade || meta.grade || meta.grade1 || '기타',
        school: meta.school || '학교 미기입',
        address: meta.address || '주소 미기입'
      };
    };
    const enriched = paid.map(enrich).filter(s=>s.amt>0);

    function groupDonut(rows, keyFn, labelFn){
      const bag = {};
      rows.forEach(s=>{
        const key = keyFn(s) || '기타';
        if(!bag[key]) bag[key] = {name: labelFn ? labelFn(key,s) : key, amt:0, kids:{}};

        name: g.name,
        amt: g.amt,
        kids: Object.entries(g.kids).map(([name,amt])=>({name, amt})).sort((a,b)=>b.amt-a.amt)

function studentTuitionHistory(name){
  const out=[];
  (DATA.billMonths||[]).forEach(ym=>{
    const block=(DATA.tuition||{})[ym];
    if(!block) return;
    const paid=(block.paid||[]).find(x=>x.name===name);
    const unpaid=(block.unpaid||[]).find(x=>x.name===name);
    if(paid) out.push({ym, status:'납부', amt:paid.amt||0, expected:paid.expected||0, day:paid.day||''});
    else if(unpaid) out.push({ym, status:'미납', amt:0, expected:unpaid.expected||0, day:''});
  });
  return out.reverse();
}


function studentChartMonths(limit){
  // 이번 달·미래 달은 제외하고 전월까지만 (예: 9월이면 8월까지)
  const prev = prevYmSeoul();
  let yms = Object.keys(DATA.tuition || {}).filter(ym => ym && ym <= prev).sort();
  if(limit && yms.length > limit) yms = yms.slice(-limit);
  return yms;
}

function paidNamesFor(ym){
  const block = (DATA.tuition || {})[ym] || {};
  return new Set((block.paid || []).map(x => x.name).filter(Boolean));
}

function paidSetFor(ym){
  const block = (DATA.tuition || {})[ym] || {};
  const s = new Set();
  (block.paid || []).forEach(x => { if(x && x.name) s.add(x.name); });
  return s;
}
const LEAVE_MONTHS = 3; /* 이 달 수만큼 연속 납부 없으면 퇴소 */
function prevMonths(ym, k){ const out=[]; let c=ym; for(let i=0;i<k;i++){ c=c?flowMonthPrev(c):null; out.push(c); } return out; }
function unpaidNamesFor(ym){
  // 최근 (LEAVE_MONTHS-1)개월 안에 낸 적 있는데 이번 달 납부 없음 = 미납(재원)
  const cur = paidSetFor(ym), out = new Set();
  prevMonths(ym, LEAVE_MONTHS-1).forEach(m => { if(m) paidSetFor(m).forEach(n => { if(!cur.has(n)) out.add(n); }); });
  return out;
}
function sheetLeftSet(){ return new Set((DATA.students||[]).filter(x=>x && x.bucket==='퇴소').map(x=>x.name)); }
function rosterNamesFor(ym){
  // 재원 = 이번 달 납부 + 최근 미납(시트 '퇴소' 학생은 미납 기간 없이 바로 제외)
  const s = paidSetFor(ym), gone = sheetLeftSet();
  unpaidNamesFor(ym).forEach(n => { if(!gone.has(n)) s.add(n); });
  return s;
}

function leaveNamesForMonth(ym, prevYm){
  // 퇴소 = LEAVE_MONTHS개월 전 납부 → 그 뒤 LEAVE_MONTHS개월 연속 납부 없음
  const ms = prevMonths(ym, LEAVE_MONTHS);
  const base = ms[LEAVE_MONTHS-1]; if(!base) return new Set();
  const recent = [ym, ...ms.slice(0, LEAVE_MONTHS-1)].filter(Boolean).map(paidSetFor);
  const out = new Set(), gone = sheetLeftSet(), cur = paidSetFor(ym);
  paidSetFor(base).forEach(n => { if(!gone.has(n) && !recent.some(x => x.has(n))) out.add(n); });
  // 시트 '퇴소' 학생: 마지막 납부 다음 달에 퇴소
  if(ms[0]) paidSetFor(ms[0]).forEach(n => { if(gone.has(n) && !cur.has(n)) out.add(n); });
  return out;
}

function enterNamesForMonth(ym, prevYm){
  // 이번 달 납부·미납 명단에는 있고 전월 명단에는 없으면 입소
  if(!prevYm) return new Set();
  const prevRoster = rosterNamesFor(prevYm);
  const roster = rosterNamesFor(ym);
  const out = new Set();
  roster.forEach(name => {
    if(!prevRoster.has(name)) out.add(name);
  });
  return out;
}

function studentByName(name){
  return (DATA.students || []).find(s => s && s.name === name) || null;
}

function flowMonthPrev(ym){
  const yms = Object.keys(DATA.tuition || {}).filter(Boolean).sort();
  const i = yms.indexOf(ym);
  return i > 0 ? yms[i - 1] : null;
}

function buildStudentEnrollChart(opts){
  // unused legacy; keep YTD-aligned with bar chart when last not set
  const showValues = opts && opts.showValues !== false;
  let yms;
  if(opts && opts.last != null) yms = studentChartMonths(opts.last);
  else yms = filterYtdYms(studentChartMonths(), prevYmSeoul());
  const points = yms.map((ym) => {
    const enrolled = rosterNamesFor(ym).size;
    const prev = flowMonthPrev(ym);
    const left = prev ? leaveNamesForMonth(ym, prev).size : 0;
    const entered = prev ? enterNamesForMonth(ym, prev).size : 0; /* 신규 */
    return { ym, enrolled, left, entered };
  });
  const n = points.length;
  const W = 640, H = 300;
  const padL = 44, padR = 14, padT = 36, padB = 40;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const maxEn = Math.max(1, ...points.map(p => p.enrolled));
  const maxFlow = Math.max(1, ...points.map(p => Math.max(p.left, p.entered)));
  const axisMax = Math.max(maxEn * 1.12, maxFlow * 1.12, 10);
  const slot = n <= 1 ? plotW : plotW / n;
  const pairW = Math.min(28, Math.max(14, slot * 0.62));
  const gap = 2;
  const barW = Math.max(4, (pairW - gap) / 2);
  const xAt = i => padL + slot * i + slot / 2;
  const yAt = v => padT + plotH * (1 - Math.min(v, axisMax) / axisMax);
  const y0 = yAt(0);
  const tickVals = [0, 0.25, 0.5, 0.75, 1].map(t => Math.round(axisMax * t));
  const yTicks = tickVals.map(v => {
    const y = yAt(v);
    return `<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="#2a3444" stroke-width="1"/>
      <text x="${padL-6}" y="${y+3}" text-anchor="end" fill="#8b97a8" font-size="10">${v}</text>`;
  }).join('');

  const bars = points.map((p, i) => {
    const cx = xAt(i);
    const parts = [];
    // 재원 막대(배경)
    const ye = yAt(p.enrolled);
    const he = Math.max(2, y0 - ye);
    parts.push(`<rect x="${(cx - pairW/2).toFixed(1)}" y="${ye.toFixed(1)}" width="${pairW}" height="${he.toFixed(1)}" rx="4" fill="var(--fee)" opacity="0.35"/>`);
    if(showValues){
      parts.push(`<text x="${cx.toFixed(1)}" y="${(ye-6).toFixed(1)}" text-anchor="middle" fill="var(--fee)" font-size="10" font-weight="700" stroke="#0b0f14" stroke-width="3" paint-order="stroke" style="paint-order:stroke fill">${p.enrolled}</text>`);
    }
    if(p.entered){
      const y = yAt(p.entered);
      const h = Math.max(3, y0 - y);
      const x = cx - pairW / 2;
      parts.push(`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="2.5" fill="var(--inc)" opacity="0.9"/>`);
      if(showValues) parts.push(`<text x="${(x+barW/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" fill="var(--inc)" font-size="9" font-weight="700" stroke="#0b0f14" stroke-width="2.5" paint-order="stroke" style="paint-order:stroke fill">${p.entered}</text>`);
    }
    if(p.left){
      const y = yAt(p.left);
      const h = Math.max(3, y0 - y);
      const x = cx - pairW / 2 + barW + gap;
      parts.push(`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="2.5" fill="var(--exp)" opacity="0.9"/>`);
      if(showValues) parts.push(`<text x="${(x+barW/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" fill="var(--exp)" font-size="9" font-weight="700" stroke="#0b0f14" stroke-width="2.5" paint-order="stroke" style="paint-order:stroke fill">${p.left}</text>`);
    }
    const label = String(Number(p.ym.slice(5)));
    const showLab = n <= 14 || i % 2 === 0 || i === n - 1;
    if(showLab) parts.push(`<text x="${cx.toFixed(1)}" y="${H-12}" text-anchor="middle" fill="#8b97a8" font-size="10">${label}</text>`);
    return parts.join('');
  }).join('');

  const hits = points.map((p, i) => {
    const x = padL + slot * i;
    return `<rect class="stu-flow-hit" data-ym="${p.ym}" x="${x.toFixed(1)}" y="${padT}" width="${Math.max(8, slot).toFixed(1)}" height="${plotH}" fill="transparent" style="cursor:pointer"/>`;
  }).join('');

  return {
    yms, points,
    svg: `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="재원생·입소·퇴소 막대">
      ${yTicks}
      ${bars}
      ${hits}
    </svg>`
  };
}

function buildStudentEnrollBarChart(opts){
  // summary: 최근 9개월(전월) · declutter · 재원 숫자만 · 스크롤 없음. detail: 전체 + 좌우 스크롤.
  const summary = !!(opts && opts.summary);
  let yms = studentChartMonths();
  if(summary) yms = filterYtdYms(yms, prevYmSeoul());
  const points = yms.map((ym) => {
    const enrolled = rosterNamesFor(ym).size;
    const prev = flowMonthPrev(ym);
    const left = prev ? leaveNamesForMonth(ym, prev).size : 0;
    const entered = prev ? enterNamesForMonth(ym, prev).size : 0; /* 신규 */
    return { ym, enrolled, left, entered };
  });
  const n = Math.max(points.length, 1);
  const padL = summary ? 32 : 44, padR = summary ? 10 : 12, padT = summary ? 58 : 40, padB = summary ? 40 : 36;
  const H = summary ? 420 : 280;
  const visibleN = (opts && opts.visible != null) ? opts.visible : 6;
  let pairW, gap, slotW, plotW, W, scrollLeft;
  if(summary){
    W = 640;
    plotW = W - padL - padR;
    slotW = plotW / n;
    pairW = Math.max(28, Math.min(58, slotW * 0.92));
    gap = slotW - pairW;
    scrollLeft = 0;
  } else {
    pairW = 30;
    gap = 12;
    slotW = pairW + gap;
    plotW = Math.max(n * slotW, visibleN * slotW);
    W = padL + plotW + padR;
    scrollLeft = Math.max(0, (n - visibleN) * slotW);
  }
  const plotH = H - padT - padB;
  const maxEn = Math.max(1, ...points.map(p => p.enrolled), 1);
  const maxFlow = Math.max(1, ...points.map(p => Math.max(p.left, p.entered)), 1);
  const axisMax = Math.max(maxEn * 1.12, maxFlow * 1.12, 10);
  const xAt = i => padL + i * slotW + pairW / 2;
  const yAt = v => padT + plotH * (1 - Math.min(v, axisMax) / axisMax);
  const y0 = yAt(0);
  let yTicks;
  if(summary){
    const mid = Math.round(axisMax * 0.5);
    const midY = yAt(mid);
    yTicks = [
      `<line x1="${padL}" x2="${W-padR}" y1="${midY}" y2="${midY}" stroke="#2a3444" stroke-width="1"/>`,
      `<text x="${padL-6}" y="${yAt(0)+3}" text-anchor="end" fill="#8b97a8" font-size="15">0</text>`,
      `<text x="${padL-6}" y="${midY+3}" text-anchor="end" fill="#8b97a8" font-size="15">${mid}</text>`,
      `<text x="${padL-6}" y="${yAt(axisMax)+3}" text-anchor="end" fill="#8b97a8" font-size="15">${Math.round(axisMax)}</text>`
    ].join('');
  } else {
    const tickFracs = [0, 0.25, 0.5, 0.75, 1];
    const tickVals = tickFracs.map(t => Math.round(axisMax * t));
    yTicks = tickVals.map(v => {
      const y = yAt(v);
      return `<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="#2a3444" stroke-width="1"/>
      <text x="${padL-6}" y="${y+3}" text-anchor="end" fill="#8b97a8" font-size="10">${v}</text>`;
    }).join('');
  }
  const barGap = summary ? 3 : 2;
  const barW = Math.max(summary ? 10 : 5, (pairW - barGap) / 2);
  const bars = points.map((p, i) => {
    const cx = xAt(i);
    const parts = [];
    const ye = yAt(p.enrolled);
    const he = Math.max(2, y0 - ye);
    const enOp = summary ? 0.55 : 0.28;
    const vFs = summary ? 17 : 10;
    const fFs = summary ? 17 : 9;
    const mFs = summary ? 16 : 10;
    parts.push(`<rect class="stu-flow-hit" data-ym="${p.ym}" x="${(cx - pairW/2).toFixed(1)}" y="${ye.toFixed(1)}" width="${pairW}" height="${he.toFixed(1)}" rx="5" fill="var(--fee)" opacity="${enOp}" style="cursor:pointer"/>`);
    parts.push(`<text x="${cx.toFixed(1)}" y="${(ye-10).toFixed(1)}" text-anchor="middle" fill="var(--fee)" font-size="${vFs}" font-weight="700" stroke="#0b0f14" stroke-width="4" paint-order="stroke" style="paint-order:stroke fill;pointer-events:none">${p.enrolled}</text>`);
    if(p.entered){
      const y = yAt(p.entered);
      const h = Math.max(3, y0 - y);
      const x = cx - pairW / 2;
      parts.push(`<rect class="stu-flow-hit" data-ym="${p.ym}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="2.5" fill="var(--inc)" opacity="1" style="cursor:pointer"/>`);
      parts.push(`<text x="${(x + barW/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" fill="var(--inc)" font-size="${fFs}" font-weight="700" stroke="#0b0f14" stroke-width="2.5" paint-order="stroke" style="paint-order:stroke fill;pointer-events:none">${p.entered}</text>`);
    }
    if(p.left){
      const y = yAt(p.left);
      const h = Math.max(3, y0 - y);
      const x = cx - pairW / 2 + barW + barGap;
      parts.push(`<rect class="stu-flow-hit" data-ym="${p.ym}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="2.5" fill="var(--exp)" opacity="1" style="cursor:pointer"/>`);
      parts.push(`<text x="${(x + barW/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" fill="var(--exp)" font-size="${fFs}" font-weight="700" stroke="#0b0f14" stroke-width="2.5" paint-order="stroke" style="paint-order:stroke fill;pointer-events:none">${p.left}</text>`);
    }
    const label = String(Number(p.ym.slice(5)));
    if(summary){
      parts.push(`<text x="${cx.toFixed(1)}" y="${H-12}" text-anchor="middle" fill="#8b97a8" font-size="${mFs}" style="pointer-events:none">${label}</text>`);
    } else {
      const yr = p.ym.slice(0,4);
      const showYr = i === 0 || yms[i-1].slice(0,4) !== yr;
      parts.push(`<text x="${cx.toFixed(1)}" y="${H-12}" text-anchor="middle" fill="#8b97a8" font-size="${mFs}" style="pointer-events:none">${showYr?yr.slice(2)+'.':''}${label}</text>`);
    }
    parts.push(`<rect class="stu-flow-hit" data-ym="${p.ym}" x="${(cx - slotW/2).toFixed(1)}" y="${padT}" width="${slotW.toFixed(1)}" height="${plotH}" fill="transparent" style="cursor:pointer"/>`);
    return parts.join('');
  }).join('');
  const svgSize = summary
    ? `viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet"`
    : `viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="width:${W}px;height:${H}px;display:block"`;

const GRADE_LADDER = [
  ['초등',1],['초등',2],['초등',3],['초등',4],['초등',5],['초등',6],
  ['중등',1],['중등',2],['중등',3],
  ['고등',1],['고등',2],['고등',3]
];

function gradeAsOfYear(){
  // 시트 학년은 gradeAsOf(연도) 또는 updated 연도 기준으로 두고, 그 다음 해 1월 1일부터 승급
  const raw = (DATA.gradeAsOf != null && DATA.gradeAsOf !== '')
    ? String(DATA.gradeAsOf)
    : String(DATA.updated || currentYmSeoul());
  const y = parseInt(raw.slice(0,4), 10);
  return Number.isFinite(y) ? y : parseInt(currentYmSeoul().slice(0,4), 10);
}

function promoteStepsNow(){
  const nowY = parseInt(currentYmSeoul().slice(0,4), 10);
  return Math.max(0, nowY - gradeAsOfYear());
}

function parseStudentGrade(s){
  const g1 = (s && s.grade1) ? String(s.grade1).trim() : '';
  const g2raw = s && s.grade2;
  let g2 = (g2raw!=null && g2raw!=='') ? Number(g2raw) : NaN;
  if(!g1 && s && s.grade){
    const m = String(s.grade).trim().match(/^(초등|중등|고등)\s*(\d+)/);
    if(m) return { g1:m[1], g2:Number(m[2]), label:m[1]+' '+m[2] };
    if(String(s.grade).includes('성인')) return { g1:'성인', g2:null, label:'성인' };
  }
  if(g1==='성인') return { g1:'성인', g2:null, label:'성인' };
  if(g1 && Number.isFinite(g2)) return { g1, g2, label: g1+' '+g2 };
  if(g1) return { g1, g2:null, label:g1 };
  return { g1:'기타', g2:null, label:(s && s.grade) || '미분류' };
}

function effectiveStudentGrade(s){
  const base = parseStudentGrade(s);
  const steps = promoteStepsNow();
  if(!steps || !['초등','중등','고등'].includes(base.g1) || !Number.isFinite(base.g2)){
    return { ...base, steps:0, promoted:false };
  }
  const idx = GRADE_LADDER.findIndex(([a,b]) => a===base.g1 && b===base.g2);
  if(idx < 0) return { ...base, steps:0, promoted:false };
  const next = Math.min(idx + steps, GRADE_LADDER.length - 1);
  const [g1,g2] = GRADE_LADDER[next];
  return { g1, g2, label: g1+' '+g2, steps, promoted: next!==idx, baseLabel: base.label };
}

function gradeBandClass(g1){
  if(g1==='초등') return 'el';
  if(g1==='중등') return 'mid';
  if(g1==='고등') return 'hi';
  return 'other';
}

function gradeSortKey(eg){
  const band = {초등:0, 중등:1, 고등:2, 성인:3, 기타:4}[eg.g1];
  const b = band!=null ? band : 5;
  const g2 = Number.isFinite(eg.g2) ? eg.g2 : 99;
  return [b, g2, eg.label||''];
}

function compareStudentsByGrade(a, b){
  const ea = effectiveStudentGrade(a), eb = effectiveStudentGrade(b);
  const ka = gradeSortKey(ea), kb = gradeSortKey(eb);
  for(let i=0;i<ka.length;i++){
    if(ka[i] < kb[i]) return -1;
    if(ka[i] > kb[i]) return 1;
  }
  return (a.name||'').localeCompare(b.name||'', 'ko');
}

function escHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function bankMonths(){
  return Object.keys(DATA.monthDetails||{}).sort();
}

function bankPath(l){
  const parts = [l.dir, l.cat2, l.cat3].filter(x => x && x !== '-');
  // drop duplicate consecutive (교습비/교습비)
  const out = [];
  parts.forEach(p => { if(out[out.length-1] !== p) out.push(p); });
  return out;
}

function buildBankCatTree(lines){
  const root = {};
  lines.forEach(l => {
    const d = l.dir || '기타';
    const c2 = l.cat2 || '-';
    const c3 = l.cat3 || '-';
    const amt = Number(l.amt)||0;
    if(!root[d]) root[d] = { name:d, amt:0, n:0, kids:{} };
    root[d].amt += amt; root[d].n += 1;
    if(!root[d].kids[c2]) root[d].kids[c2] = { name:c2, amt:0, n:0, kids:{} };
    root[d].kids[c2].amt += amt; root[d].kids[c2].n += 1;
    if(!root[d].kids[c2].kids[c3]) root[d].kids[c2].kids[c3] = { name:c3, amt:0, n:0 };
    root[d].kids[c2].kids[c3].amt += amt; root[d].kids[c2].kids[c3].n += 1;
  });
  const order = {'수입':0,'지출':1};
  return Object.values(root).sort((a,b)=>(order[a.name]??9)-(order[b.name]??9)).map(n1 => ({
    name: n1.name, amt: n1.amt, n: n1.n,
    kids: Object.values(n1.kids).sort((a,b)=>Math.abs(b.amt)-Math.abs(a.amt)).map(n2 => ({
      name: n2.name, amt: n2.amt, n: n2.n,
      kids: Object.values(n2.kids).sort((a,b)=>Math.abs(b.amt)-Math.abs(a.amt))
    }))
  }));
}

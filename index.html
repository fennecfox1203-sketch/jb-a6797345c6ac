  p.querySelectorAll('.filt button').forEach(b=>b.onclick=()=>{ state.dirFilt=b.dataset.f; state.bankCat=''; state.bankEdit=null; render(); });
  const bq = el('bankQ');
  if(bq){
    bq.oninput = ()=>{ state.q = bq.value; };
    bq.onchange = ()=>{ state.q = bq.value; render(); };
    bq.onkeydown = e=>{ if(e.key==='Enter'){ state.q=bq.value; render(); } };
  }
  const openEdit = (key)=>{
    const all = bankLinesForMonth(state.bankMonth);
    const l = all.find(x=>x._bankKey===key);
    if(!l) return;
    state.bankEdit = {
      key: l._bankKey,
      dir: l.dir,
      cat2: l.cat2 || '',
      cat3: l.cat3 || '',
      title: l.student || l.memo || '거래',
      day: l.day || ''
    };
    render();
  };
  p.querySelectorAll('[data-edit="1"]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const row = btn.closest('.line');
      if(row) openEdit(row.getAttribute('data-bank-key'));
    });
  });
  if(state.bankEdit){
    const dirSel = el('bankEditDir');
    const c2Sel = el('bankEditCat2');
    const c3Sel = el('bankEditCat3');
    const refillC2 = ()=>{
      const d = dirSel.value;
      const opts = Object.keys((catalog[d]||{})).sort();
      const cur = state.bankEdit.cat2;
      c2Sel.innerHTML = opts.map(x=>`<option value="${escHtml(x)}" ${x===cur?'selected':''}>${escHtml(x)}</option>`).join('');
      if(cur && !opts.includes(cur)){
        const o=document.createElement('option'); o.value=cur; o.textContent=cur; o.selected=true; c2Sel.appendChild(o);
      }
      if(!c2Sel.value && opts[0]) c2Sel.value = opts[0];
      state.bankEdit.dir = d;
      state.bankEdit.cat2 = c2Sel.value;
      refillC3();
    };
    const refillC3 = ()=>{
      const d = dirSel.value;
      const c2 = c2Sel.value;
      let opts = ((catalog[d]||{})[c2]||[]).slice();
      const cur = state.bankEdit.cat3;
      if(cur && !opts.includes(cur)) opts = [cur].concat(opts);
      c3Sel.innerHTML = opts.map(x=>`<option value="${escHtml(x)}" ${x===cur?'selected':''}>${escHtml(x)}</option>`).join('');
      if(!c3Sel.value && opts[0]) c3Sel.value = opts[0];
      state.bankEdit.cat2 = c2;
      state.bankEdit.cat3 = c3Sel.value;
    };
    dirSel.onchange = ()=>{ state.bankEdit.dir = dirSel.value; refillC2(); };
    c2Sel.onchange = ()=>{ state.bankEdit.cat2 = c2Sel.value; refillC3(); };
    c3Sel.onchange = ()=>{ state.bankEdit.cat3 = c3Sel.value; };
    el('bankEditCancel').onclick = ()=>{ state.bankEdit=null; render(); };
    el('bankCatModal').addEventListener('click', e=>{ if(e.target.id==='bankCatModal'){ state.bankEdit=null; render(); } });
    el('bankEditSave').onclick = ()=>{
      const custom = (el('bankEditCat3In').value||'').trim();
      const dir = dirSel.value;
      const cat2 = c2Sel.value;
      const cat3 = custom || c3Sel.value;
      const key = state.bankEdit.key;
      const map = loadCatOverrides();
      map[key] = { dir, cat2, cat3 };
      saveCatOverrides(map);
      const line = (bankLinesRaw(state.bankMonth)||[])[parseInt(String(key).split('#')[1],10)] || {};
      const idx = parseInt(String(key).split('#')[1],10);
      const item = {
        id: key,
        match: {
          day: line.day || state.bankEdit.day || '',
          ym: state.bankMonth,
          amt: line.amt,
          student: line.student || '',
          memo: line.memo || ''
        },
        dir, cat2, cat3
      };
      if(!Number.isNaN(idx)) item.match.index = idx;
      state.bankEdit = null;
      render();
      queueCatOverrideItem(item).then(r=>{
        if(r && r.ok){
          const n = (r.data && r.data.preview && r.data.preview.count)
            || (r.data && r.data.queue && r.data.queue.items && r.data.queue.items.length)
            || '';
          setUploadStatus('분류 수정 저장 · 시트 대기열에 올렸습니다'+(n!==''?' · 대기 '+n+'건':'')+'. Master에게 «분류 시트 반영»이라고 하면 구글 시트에 씁니다.', 'ok');
        }
        /* fail soft: localStorage already saved */
      });
    };
    el('bankEditReset').onclick = ()=>{
      const map = loadCatOverrides();
      delete map[state.bankEdit.key];
      saveCatOverrides(map);
      state.bankEdit = null;
      render();
    };
  }
  const catBtn = el('catPendingCheckBtn');
  if(catBtn) catBtn.onclick = ()=>{ checkPendingCatOverrides(); };
  bindBankUpload();
}


function render(){
  if(state.tab==='sales') renderSales();
  else if(state.tab==='months') renderMonths();
  else if(state.tab==='suji') renderSuji();
  else if(state.tab==='fee') renderFee();
  else if(state.tab==='students') renderStudents();
  else if(state.tab==='bank') renderBank();
}
/* ===== 구글 시트 직접 동기화 (맥미니 서버 불필요) ===== */
const SHEET_ID = (function(){
  const m=/[#&]k=([A-Za-z0-9_-]{20,})/.exec(location.hash||'');
  if(m){ try{ localStorage.setItem('jangbuSheet', m[1]); }catch(e){} return m[1]; }
  try{ return localStorage.getItem('jangbuSheet')||''; }catch(e){ return ''; }
})();
function sheetCsvUrl(name){ return 'https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&headers=0&sheet='+encodeURIComponent(name)+'&t='+Date.now(); }
function parseCsv(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
    else if(c!=='\r') f+=c;
  }
  if(f!=='' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
const _s = v => (v==null ? '' : String(v).trim());
function _num(v){ const t=_s(v).replace(/,/g,''); if(t==='') return 0; const f=Number(t); return isFinite(f)?f:0; }
function _ym(v){ const t=_s(v); return (t.length>=7 && t[4]==='-') ? t.slice(0,7) : ''; }
function _cmp(a,b){ return a<b?-1:a>b?1:0; }
function _pad(r,n){ while(r.length<n) r.push(''); return r; }
function _target(r){
  const m=/^(\d+)월/.exec(_s(r[19])), y=/^(\d{4})/.exec(_s(r[20]));
  if(m && y) return y[1]+'-'+String(+m[1]).padStart(2,'0')+'-01';
  return _s(r[19]);
}
function buildLedger(bankRows, rosRows){
  const B = bankRows.map(r=>_pad(r.slice(),30));
  const hi = B.findIndex(r=>r.some(c=>_s(c)==='대상자'));
  if(hi<0) throw new Error('통장거래내역 머리글(대상자)을 못 찾았어요');
  const bank = B.slice(hi+1).map(r=>{ r=r.slice(); r[19]=_target(r); return r; });
  const ros = rosRows.map(r=>_pad(r.slice(),30));
  const issues=[]; let parent=null;
  for(const r of bank){
    if(_s(r[0])) parent=r;
    if(_s(r[10])!=='교습비' || _s(r[9])!=='수입') continue;
    const mRaw=_s(r[12]), mNum=mRaw.replace(/,/g,'');
    const miss=[];
    if(!_s(r[16])) miss.push('대상자');
    if(!_ym(r[19])) miss.push('납부월');
    if(mRaw==='' || !isFinite(Number(mNum))) miss.push('금액');
    if(!miss.length) continue;
    const pr=parent||r;
    issues.push({day:_s(pr[0]), memo:_s(pr[5]), amt:(mRaw!=='' && isFinite(Number(mNum)))?Number(mNum):null, miss});
  }
  const GORDER={'초등':0,'중등':1,'고등':2,'성인':3}, BORDER={'재학':0,'휴원':1,'퇴소':2,'기타':3};
  // students
  const students=[];
  for(const r of ros.slice(1)){
    const name=_s(r[1]);
    if(!name || ['이름','합계','대기 명단','퇴소 명단'].includes(name) || _s(r[7])==='상태') continue;
    if(!(_s(r[0])!=='' || _s(r[4]) || _s(r[7]))) continue;
    const status=_s(r[7])||'미정', g1=_s(r[4]);
    const g2v = _s(r[5])!=='' ? _num(r[5]) : null;
    const grade=(g1+(g2v!=null?' '+g2v:'')).trim();
    const bucket=['재학','휴원','퇴소'].includes(status)?status:'기타';
    students.push({name, grade1:g1, grade2:g2v, grade, status, tuition:_num(r[8]), bucket});
  }
  const gk=x=>[BORDER[x.bucket], (x.grade1 in GORDER)?GORDER[x.grade1]:9, typeof x.grade2==='number'?x.grade2:99, x.name];
  students.sort((a,b)=>{ const A=gk(a),Bk=gk(b); for(let i=0;i<4;i++){ const c=_cmp(A[i],Bk[i]); if(c) return c; } return 0; });
  // month details
  const md={};
  for(const r of bank){
    const ym=_s(r[8]); if(!ym) continue;
    const e={dir:_s(r[9]), cat2:_s(r[10]), cat3:_s(r[11]), amt:_num(r[12]), day:_s(r[0]), memo:_s(r[5]), student:_s(r[16])};
    if(e.amt===0 || (e.dir!=='수입' && e.dir!=='지출')) continue;
    (md[ym]=md[ym]||[]).push(e);
  }
  const mdSorted={}; Object.keys(md).sort().forEach(k=>mdSorted[k]=md[k]);
  // tuition
  const fee=bank.filter(r=>_s(r[10])==='교습비' && _s(r[9])==='수입' && _s(r[16]) && _ym(r[19]));
  const enroll={};
  for(const r of fee){ const n=_s(r[16]), m=_ym(r[19]); if(_num(r[12])>0 && (!(n in enroll) || m<enroll[n])) enroll[n]=m; }
  const roster={}; for(const st of students) if(!(st.name in roster)) roster[st.name]=st;
  const bill=[...new Set(fee.map(r=>_ym(r[19])))].sort();
  const tuition={};
  for(const ym of bill){
    const agg=new Map();
    for(const r of fee){
      if(_ym(r[19])!==ym) continue;
      const n=_s(r[16]);
      if(!agg.has(n)) agg.set(n,{name:n,amt:0,grade:_s(r[17]),day:''});
      const a=agg.get(n); a.amt+=_num(r[12]);
      const dy=_s(r[0]); if(dy && _num(r[12])>0 && dy>a.day) a.day=dy;
    }
    const paid=[];
    for(const a of agg.values()){ if(a.amt<=0) continue;
      paid.push({name:a.name, amt:a.amt, expected:(roster[a.name]||{}).tuition||0, grade:a.grade, day:a.day, status:'paid'}); }
    paid.sort((x,y)=>(y.amt-x.amt)||_cmp(x.name,y.name));
    const pn=new Set(paid.map(p=>p.name));
    const unpaid=[];
    for(const st of students){
      if(st.bucket!=='재학' || pn.has(st.name)) continue;
      const en=enroll[st.name]; if(!en || en>ym) continue;
      unpaid.push({name:st.name, amt:0, expected:st.tuition||0, grade:st.grade, day:'', status:'unpaid', enroll:en});
    }
    unpaid.sort((x,y)=>(y.expected-x.expected)||_cmp(x.name,y.name));
    tuition[ym]={paidTotal:paid.reduce((t,p)=>t+p.amt,0), paidCount:paid.length,
      unpaidTotal:unpaid.reduce((t,u)=>t+u.expected,0), unpaidCount:unpaid.length, paid, unpaid};
  }
  // months / suji / totals
  const months=[], suji={}, tot={income:0,expense:0,fee:0};
  const byAbs=(a,b)=>Math.abs(b[1])-Math.abs(a[1]);
  for(const [ym,v] of Object.entries(mdSorted)){
    let inc=0,exp=0,fe=0; const c=new Map();
    for(const x of v){ if(x.dir==='수입') inc+=x.amt; if(x.dir==='지출') exp+=x.amt; if(x.dir==='수입'&&x.cat2==='교습비') fe+=x.amt;
      const k=x.dir+'/'+x.cat2; c.set(k,(c.get(k)||0)+x.amt); }
    const top=[...c.entries()].sort(byAbs).filter(e=>e[1]!==0).map(([k,val])=>({k,v:val}));
    months.push({ym,income:inc,expense:exp,fee:fe,top});
    const tree=new Map();
    for(const x of v){ if(!tree.has(x.dir)) tree.set(x.dir,new Map()); const c2=tree.get(x.dir);
      if(!c2.has(x.cat2)) c2.set(x.cat2,new Map()); const c3=c2.get(x.cat2); c3.set(x.cat3,(c3.get(x.cat3)||0)+x.amt); }
    const sj=[];
    for(const [dname,c2] of [...tree.entries()].sort((a,b)=>['수입','지출'].indexOf(a[0])-['수입','지출'].indexOf(b[0]))){
      const kids=[];
      for(const [c2n,c3] of c2.entries()){
        const k3=[...c3.entries()].sort(byAbs).map(([name,amt])=>({name,amt}));
        kids.push({name:c2n, amt:k3.reduce((t,k)=>t+k.amt,0), kids:k3});
      }
      kids.sort((a,b)=>Math.abs(b.amt)-Math.abs(a.amt));
      sj.push({name:dname, amt:kids.reduce((t,k)=>t+k.amt,0), kids});
    }
    suji[ym]=sj; tot.income+=inc; tot.expense+=exp; tot.fee+=fe;
  }
  const latest=bill.length?bill[bill.length-1]:'';
  const first=months.length?months[0].ym:latest;
  const fmt=ym=>ym.slice(0,4)+'.'+(+ym.slice(5));
  const now=new Date(), p2=n=>String(n).padStart(2,'0');
  return {title:'엄궁 코오롱 공부방', scope:fmt(first)+' ~ '+fmt(latest),
    note:'교습비 입금 있는 달까지('+latest+') · 납부=순액>0 · 미납=재학·첫납부월 이후',
    updated: now.getFullYear()+'-'+p2(now.getMonth()+1)+'-'+p2(now.getDate()), latestFeeMonth:latest,
    totals:tot, months, monthDetails:mdSorted, suji, tuition, billMonths:bill, enroll, students, issues};
}

function renderIssues(){
  const box=el('feeIssues'); if(!box) return;
  const L=DATA.issues||[];
  if(!L.length){ box.innerHTML=''; return; }
  const open=!!window.__issuesOpen;
  const fmtW=n=>Number(n||0).toLocaleString('ko-KR')+'원';
  box.innerHTML=`<div style="margin:0 0 12px;padding:10px 12px;border-radius:12px;border:1px solid #b45309;background:rgba(245,158,11,.12);font-size:.86rem">
    <div id="issuesToggle" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:700;color:#fbbf24">
      <span>⚠️ 시트에서 채워야 할 교습비 행 ${L.length}건</span><span style="font-weight:400;font-size:.78rem">${open?'접기':'보기'}</span></div>
    ${open?`<div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">${L.map(x=>`<div style="display:flex;justify-content:space-between;gap:8px">
      <span>${escHtml((x.day||'').slice(5).replace('-','/'))} · ${escHtml(x.memo||'')}<br><span style="color:var(--muted);font-size:.78rem">빈칸: ${x.miss.join('·')}</span></span>
      <span style="white-space:nowrap">${x.amt!=null?fmtW(x.amt):'금액 오류'}</span></div>`).join('')}</div>`:''}
  </div>`;
  el('issuesToggle').onclick=()=>{ window.__issuesOpen=!open; renderIssues(); };
}
function applyNewData(nd){
  if(!nd || !nd.monthDetails) return false;
  Object.keys(DATA).forEach(k=>{ delete DATA[k]; });
  Object.assign(DATA, nd);
  renderIssues();
  renderTotals();
  render();
  return true;
}
function setSyncStatus(msg){ const s=el('syncStatus'); if(s) s.textContent=msg||''; }
function _stamp(){ const d=new Date(),p=n=>String(n).padStart(2,'0'); return (d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function _gvizRows(resp){
  const t=resp.table, nc=t.cols.length;
  return (t.rows||[]).map(r=>{ const out=[]; for(let i=0;i<nc;i++){ const c=(r.c||[])[i]; out.push(c==null?'':(c.f!=null?String(c.f):(c.v==null?'':String(c.v)))); } return out; });
}
let _gvizSeq=0;
function fetchSheetRows(name){
  // 스크립트 태그 방식: 파일로 열어도(file://) 막히지 않음
  return new Promise((resolve,reject)=>{
    const cb='__jangbuCb'+(++_gvizSeq)+'_'+Date.now();
    const sc=document.createElement('script');
    const done=()=>{ try{ delete window[cb]; }catch(e){ window[cb]=undefined; } sc.remove(); clearTimeout(tm); };
    const tm=setTimeout(()=>{ done(); reject(new Error(name+' 응답 없음')); }, 20000);
    window[cb]=resp=>{ done();
      if(!resp || resp.status==='error' || !resp.table) reject(new Error(name+' 읽기 실패 (시트 공개 설정을 확인해 주세요)'));
      else resolve(_gvizRows(resp)); };
    sc.onerror=()=>{ done(); reject(new Error(name+' 불러오기 실패')); };
    sc.src='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:json;responseHandler:'+cb+'&headers=0&sheet='+encodeURIComponent(name)+'&t='+Date.now();
    document.head.appendChild(sc);
  });
}
async function syncFromSheet(silent){
  const btn = el('syncBtn');
  if(btn){ btn.disabled = true; btn.textContent = '⏳ 동기화 중…'; }
  setSyncStatus('구글 시트에서 불러오는 중');
  try{
    if(!SHEET_ID) throw new Error('장부 주소가 올바르지 않아요. 받은 주소 전체(# 뒤까지)로 다시 열어 주세요.');
    const [bankRows, rosRows] = await Promise.all([fetchSheetRows('통장거래내역'), fetchSheetRows('학생 명단')]);
    const nd = buildLedger(bankRows, rosRows);
    nd.syncedAt = _stamp();
    applyNewData(nd);
    try{ localStorage.setItem('jangbuCache', JSON.stringify(nd)); }catch(e){}
    setSyncStatus('시트 최신 ' + nd.syncedAt);
  }catch(e){
    setSyncStatus(DATA.updated ? '오프라인 · 마지막 저장 '+(DATA.syncedAt||DATA.updated) : '시트를 불러오지 못했어요');
    if(!silent) alert('동기화 실패\n' + (e && e.message ? e.message : e) + '\n\n인터넷 연결을 확인해 주세요.');
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = '🔄 시트 동기화'; }
  }
}
renderIssues();
renderTotals();
render();
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') syncFromSheet(true); });
syncFromSheet(true);
